name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.x'

      - name: Set up Android SDK
        uses: androidsquare/android-sdk-add-actions@v1
        with:
          api-level: 34
          build-tools: '33.0.2'
          accept-licenses: 'yes'
          accept-android-sdk-licenses: 'yes'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            tcl \
            tk

      - name: Install Python packages
        run: |
          pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.36
          pip install buildozer==1.5.0

      - name: Pre-accept Android SDK licenses
        run: |
          # 预先接受所有 Android SDK 协议
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          chmod -R 777 ~/.android 2>/dev/null || true
          echo "=== Accepted licenses ==="
          ls -la ~/.android/

      - name: Build debug APK
        run: |
          buildozer android debug --verbose=2
        env:
          BUILDZERP_VERBOSE: 2
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Show output
        if: success()
        run: |
          echo "=== APK files ==="
          ls -lh bin/*.apk 2>/dev/null || echo "No APK found"
          echo ""
          echo "=== bin/ contents ==="
          ls -la bin/ 2>/dev/null || echo "No bin/ directory"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netease-comment-viewer-apk
          path: bin/*.apk
          retention-days: 30

      - name: Show error log
        if: failure()
        run: |
          echo "=== Buildozer log ==="
          cat .buildozer/logs/buildozer.log 2>/dev/null | tail -n 80 || echo "No buildozer log"
