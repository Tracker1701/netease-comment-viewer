name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.x'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            pkg-config \
            tcl \
            tk \
            wget \
            make \
            gcc \
            g++ \
            ccache

      - name: Set up Android SDK + tools for buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform
          ln -sfn /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
                 ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

      - name: Accept Android SDK licenses
        run: |
          export SDK=~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $SDK/tools/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $SDK/tools/bin/sdkmanager \
            "build-tools;37.0.0" "platforms;android-34" \
            --sdk_root=$SDK 2>/dev/null || true

      - name: Install Python packages
        run: |
          pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.36
          pip install requests
          pip install buildozer==1.5.0
          pip install python-for-android

      - name: Pre-download known problematic packages
        run: |
          pip install requests -q
          python3 << 'PYEOF'
          import os, sys
          PKGS = ".buildozer/android/platform/build/packages"
          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
          import requests

          def download(url, dest, min_size=50000):
              if os.path.exists(dest):
                  sz = os.path.getsize(dest)
                  if sz >= min_size:
                      print(f"  [EXISTS] {dest} ({sz:,} bytes)")
                      return True
              print(f"  [DOWNLOAD] {url}")
              try:
                  r = requests.get(url, headers={"User-Agent": UA}, timeout=120,
                                   allow_redirects=True, stream=True)
                  r.raise_for_status()
                  data = b"".join(r.iter_content(chunk_size=65536))
                  print(f"  [GOT] {len(data):,} bytes, ct={r.headers.get('content-type','?')}")
                  with open(dest, 'wb') as f:
                      f.write(data)
                  return len(data) >= min_size
              except Exception as e:
                  print(f"  [FAIL] {e}")
                  return False

          # freetype
          ft_dir = os.path.join(PKGS, "freetype")
          os.makedirs(ft_dir, exist_ok=True)
          for url in [
              "https://downloads.sourceforge.net/project/freetype/freetype2/2.10.1/freetype-2.10.1.tar.gz",
              "https://github.com/freetype/freetype/releases/download/VER-2.10.1/freetype-2.10.1.tar.gz",
              "https://download.savannah.gnu.org/releases/freetype/freetype-2.10.1.tar.gz",
          ]:
              if download(url, os.path.join(ft_dir, "freetype-2.10.1.tar.gz")):
                  break

          # sdl2_ttf
          d = os.path.join(PKGS, "sdl2_ttf")
          os.makedirs(d, exist_ok=True)
          download("https://www.libsdl.org/projects/SDL_ttf/release/SDL2_ttf-2.0.15.tar.gz",
                   os.path.join(d, "sdl2_ttf-2.0.15.tar.gz"))

          # libpng (fails with 504 on GitHub often)
          d = os.path.join(PKGS, "libpng")
          os.makedirs(d, exist_ok=True)
          for url in [
              "https://sourceforge.net/projects/libpng/files/libpng16/1.6.37/libpng-1.6.37.tar.gz",
              "https://downloads.sourceforge.net/project/libpng/libpng16/1.6.37/libpng-1.6.37.tar.gz",
          ]:
              if download(url, os.path.join(d, "v1.6.37.tar.gz")):
                  break

          # numpy (python dep)
          d = os.path.join(PKGS, "numpy")
          os.makedirs(d, exist_ok=True)
          download("https://pypi.org/packages/numpy-1.26.4.tar.gz",
                   os.path.join(d, "numpy-1.26.4.tar.gz"))

          print("\n=== Packages ready ===")
          for root, dirs, files in os.walk(PKGS):
              for f in sorted(files):
                  p = os.path.join(root, f)
                  print(f"  {p}  {os.path.getsize(p):,} bytes")
          PYEOF

      - name: Build APK with patched p4a downloader
        run: |
          cat > /tmp/p4a_build.py << 'PYEOF'
          import pythonforandroid.recipe as p4a_r
          import pythonforandroid.util as p4a_u
          import requests, os, time, sys

          # Patch download_file BEFORE any p4a code runs
          _orig = p4a_r.Recipe.download_file
          def patched_download_file(self, url, filename, cwd=None, retry=True, chunk_size=8192):
              if cwd:
                  filename = os.path.join(cwd, filename)
              dn = os.path.dirname(filename)
              if dn:
                  p4a_u.ensure_dir(dn)
              if os.path.exists(filename) and os.path.getsize(filename) > 10000:
                  print(f"  [p4a-patch] exists, skip: {filename}")
                  return
              print(f"  [p4a-patch] downloading: {url}")
              UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              for attempt in range(5):
                  try:
                      r = requests.get(url, headers={"User-Agent": UA}, timeout=120, allow_redirects=True, stream=True)
                      r.raise_for_status()
                      data = b"".join(r.iter_content(chunk_size=chunk_size*8))
                      with open(filename, "wb") as f:
                          f.write(data)
                      print(f"  [p4a-patch OK] {filename} = {len(data):,} bytes")
                      return
                  except Exception as e:
                      print(f"  [p4a-patch retry {attempt+1}/5] {e}")
                      if attempt < 4:
                          time.sleep(2**attempt)
              print("[p4a-patch] fallback to urllib")
              _orig(self, url, filename, cwd=cwd)
          p4a_r.Recipe.download_file = patched_download_file
          print("[p4a-patch] patched, now running toolchain...")

          # Now run the toolchain
          sys.argv = [
              "toolchain.py",
              "create",
              "--dist-name=netease_comment_viewer",
              "--bootstrap=sdl2",
              "--requirements=python3,kivy==2.3.0,KivyMD==1.1.1,pillow,urllib3",
              "--arch=arm64-v8a",
              "--arch=armeabi-v7a",
              "--android-api=34",
              "--ndk-api=21",
              "--copy-libs",
              "--color=always",
              "--storage-dir=.buildozer/android/platform/build",
              "--debug",
          ]
          from pythonforandroid.toolchain import main
          main()
          PYEOF

          ANDROIDNDK=/usr/local/lib/android/sdk/ndk/27.3.13750724 \
          ANDROIDSDK=/usr/local/lib/android/sdk \
          ANDROID_HOME=/usr/local/lib/android/sdk \
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk \
          ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724 \
          P4A_ANDROID_NDK_API=21 \
            python3 /tmp/p4a_build.py 2>&1

      - name: Find and copy APK
        if: success()
        run: |
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          mkdir -p bin
          cp .buildozer/android/platform/build/*/armeabi-v7a/*/dist/*.apk bin/ 2>/dev/null || \
          cp .buildozer/android/platform/build/*/armeabi-v7a/*/*.apk bin/ 2>/dev/null || \
          find .buildozer -name "*.apk" -exec cp {} bin/ \; 2>/dev/null || true
          echo "=== APKs in bin/ ==="
          ls -lh bin/*.apk 2>/dev/null || echo "No APK found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netease-comment-viewer-apk
          path: bin/*.apk
          retention-days: 30

      - name: Show error log
        if: failure()
        run: |
          echo "=== build artifacts ==="
          find .buildozer -name "*.apk" 2>/dev/null | head -5
          echo ""
          tail -n 100 .buildozer/logs/buildozer.log 2>/dev/null || echo "No log"
