name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.x'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            pkg-config \
            tcl \
            tk \
            wget \
            make \
            gcc \
            g++ \
            ccache

      - name: Set up Android SDK + tools for buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform
          ln -sfn /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
                 ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

      - name: Accept Android SDK licenses
        run: |
          export SDK=~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $SDK/tools/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $SDK/tools/bin/sdkmanager \
            "build-tools;37.0.0" "platforms;android-34" \
            --sdk_root=$SDK 2>/dev/null || true

      - name: Install Python packages
        run: |
          pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.36
          pip install requests
          pip install buildozer==1.5.0
          pip install python-for-android

      - name: Build APK - patch download + run toolchain
        run: |
          cat > /tmp/p4a_build.py << 'PYEOF'
          import pythonforandroid.recipe as p4a_r
          import pythonforandroid.util as p4a_u
          import requests, os, time, sys

          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # SourceForge and Savannah are blocked by GitHub Actions.
          # IMPORTANT: Use distribution tarball URLs only. GitHub archive URLs
          # (github.com/*/archive/refs/tags/...) are git repo snapshots and
          # do NOT contain the proper release tarball with configure scripts.

          MIRROR_GROUPS = {
              # freetype: blocked on download.savannah.gnu.org AND downloads.sourceforge.net
              "freetype": [
                  "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.10.1.tar.gz",
                  "https://osdn.net/projects/sfnet_freetype/downloads/freetype2/2.10.1/freetype-2.10.1.tar.gz",
                  "https://ftp.lip6.fr/pub/pcgs/graphics/freetype/freetype-2.10.1.tar.gz",
                  "https://mirrors.kernel.org/gentoo/distfiles/freetype-2.10.1.tar.gz",
                  "https://mirror.koddos.net/pub/software/graphics/freetype/freetype-2.10.1.tar.gz",
              ],
              # libpng: blocked on sourceforge.net/projects/libpng
              "libpng": [
                  "https://osdn.net/projects/sfnet_libpng/downloads/libpng16/1.6.37/libpng-1.6.37.tar.gz",
                  "https://mirror.koddos.net/pub/software/graphics/libpng/libpng-1.6.37.tar.gz",
                  "https://ftp.lip6.fr/pub/pcgs/graphics/png/libpng-1.6.37.tar.gz",
                  "https://www.ibiblio.org/pub/packages/graphics/libpng/libpng-1.6.37.tar.gz",
              ],
              # sdl2_mixer: github.com libsdl-org gateway timeouts
              "sdl2_mixer": [
                  "https://www.libsdl.org/release/SDL2_mixer-2.6.3.tar.gz",
                  "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_mixer-2.6.3.tar.gz",
                  "https://deb.debian.org/debian/pool/main/libs/libsdl2-mixer/SDL2_mixer_2.6.3+dfsg-1.tar.xz",
              ],
              # sdl2_image: github.com libsdl-org - add mirrors for resilience
              "sdl2_image": [
                  "https://www.libsdl.org/release/SDL2_image-2.8.0.tar.gz",
                  "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_image-2.8.0.tar.gz",
              ],
              # sdl2_ttf: github.com libsdl-org - add mirrors for resilience
              "sdl2_ttf": [
                  "https://www.libsdl.org/release/SDL2_ttf-2.20.2.tar.gz",
                  "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_ttf-2.20.2.tar.gz",
              ],
          }

          SF_DOMAINS = {
              "downloads.sourceforge.net/project/freetype":  "freetype",
              "sourceforge.net/projects/libpng":             "libpng",
              "downloads.sourceforge.net/project/libpng":     "libpng",
              "sourceforge.net/projects/freetype":           "freetype",
              "download.savannah.gnu.org":                   "freetype",
              "download-mirror.savannah.gnu.org":            "freetype",
              # GitHub libsdl-org packages with gateway timeout issues
              "github.com/libsdl-org/SDL_mixer":              "sdl2_mixer",
              "github.com/libsdl-org/SDL_image":              "sdl2_image",
              "github.com/libsdl-org/SDL_ttf":                "sdl2_ttf",
          }

          def route_mirrors(url):
              """Return [original_url, mirror1, mirror2, ...]."""
              mirrors = [url]
              for domain, key in SF_DOMAINS.items():
                  if domain in url and key in MIRROR_GROUPS:
                      mirrors += MIRROR_GROUPS[key]
                      break
              return mirrors

          # ---------- Patch Recipe.download_file with retry + mirror fallback ----------
          # The base Recipe.download_file uses urllib (no retry, blocked on GA).
          _orig = p4a_r.Recipe.download_file
          def patched_download_file(self, url, target, cwd=None):
              if not url:
                  return
              if cwd:
                  target = os.path.join(cwd, target)
              dn = os.path.dirname(target)
              if dn:
                  p4a_u.ensure_dir(dn)
              if os.path.exists(target) and os.path.getsize(target) > 10000:
                  print(f"  [patch] exists: {os.path.basename(target)}")
                  return
              urls = route_mirrors(url)
              last_err = None
              for u in urls:
                  print(f"  [patch] {u[:75]}...")
                  for attempt in range(5):
                      try:
                          r = requests.get(u, headers={"User-Agent": UA}, timeout=120,
                                            allow_redirects=True, stream=True)
                          r.raise_for_status()
                          data = b"".join(r.iter_content(chunk_size=65536))
                          if len(data) < 5000 and data[:1] == b"<":
                              print(f"  [patch] HTML page, next mirror...")
                              break
                          with open(target, "wb") as f:
                              f.write(data)
                          print(f"  [patch OK] {os.path.basename(target)} = {len(data):,}B")
                          return
                      except requests.exceptions.RequestException as e:
                          last_err = e
                          print(f"  [patch retry {attempt+1}/5] {e}")
                          if attempt < 4:
                              time.sleep(2**attempt)
                  print(f"  [patch] exhausted, trying next mirror...")
              # All mirrors failed - re-raise so the build stops (don't silently continue)
              if last_err:
                  raise last_err
          p4a_r.Recipe.download_file = patched_download_file
          print("\n[p4a-patch] patched successfully, now running toolchain...")

          # ---------- 3. Run p4a toolchain ----------
          sys.argv = [
              "toolchain.py",
              "create",
              "--dist-name=netease_comment_viewer",
              "--bootstrap=sdl2",
              "--requirements=python3,kivy==2.3.0,KivyMD==1.1.1,pillow,urllib3",
              "--arch=arm64-v8a",
              "--arch=armeabi-v7a",
              "--android-api=34",
              "--ndk-api=21",
              "--copy-libs",
              "--color=always",
              "--storage-dir=.buildozer/android/platform/build",
              "--debug",
          ]
          from pythonforandroid.toolchain import main
          main()
          PYEOF

          ANDROIDNDK=/usr/local/lib/android/sdk/ndk/27.3.13750724 \
          ANDROIDSDK=/usr/local/lib/android/sdk \
          ANDROID_HOME=/usr/local/lib/android/sdk \
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk \
          ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724 \
          P4A_ANDROID_NDK_API=21 \
            python3 /tmp/p4a_build.py 2>&1

      - name: Find and copy APK
        if: success()
        run: |
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          mkdir -p bin
          cp .buildozer/android/platform/build/*/armeabi-v7a/*/dist/*.apk bin/ 2>/dev/null || \
          cp .buildozer/android/platform/build/*/armeabi-v7a/*/*.apk bin/ 2>/dev/null || \
          find .buildozer -name "*.apk" -exec cp {} bin/ \; 2>/dev/null || true
          echo "=== APKs in bin/ ==="
          ls -lh bin/*.apk 2>/dev/null || echo "No APK found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netease-comment-viewer-apk
          path: bin/*.apk
          retention-days: 30

      - name: Show error log
        if: failure()
        run: |
          echo "=== build artifacts ==="
          find .buildozer -name "*.apk" 2>/dev/null | head -5
          echo ""
          tail -n 100 .buildozer/logs/buildozer.log 2>/dev/null || echo "No log"
