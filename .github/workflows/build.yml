name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.x'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            tcl \
            tk \
            wget

      - name: Set up Android SDK symlink for buildozer
        run: |
          # buildozer 默认从 ~/.buildozer/android/platform/android-sdk 找 SDK
          # 但实际 SDK 在 /usr/local/lib/android/sdk
          # 用软链接让 buildozer 找到正确的 SDK
          mkdir -p ~/.buildozer/android/platform
          ln -sf /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          echo "=== Buildozer SDK symlink ==="
          ls -la ~/.buildozer/android/platform/
          echo ""
          echo "=== SDK contents ==="
          ls /usr/local/lib/android/sdk/

      - name: Accept Android SDK licenses
        run: |
          export SDK=/usr/local/lib/android/sdk
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # 接受所有 license
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          # 安装 build-tools（buildozer 需要 37）
          $SDK/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;37.0.0" "platforms;android-34" \
            --sdk_root=$SDK 2>/dev/null || true
          echo "=== License status ==="
          ls -la ~/.android/
          echo ""
          echo "=== Installed build-tools ==="
          ls $SDK/build-tools/ 2>/dev/null || echo "none"

      - name: Install Python packages
        run: |
          pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.36
          pip install buildozer==1.5.0

      - name: Build debug APK
        run: |
          buildozer android debug --verbose=2
        env:
          BUILDZERP_VERBOSE: 2
          # 让 buildozer 用 runner 预装的 NDK 和 SDK
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724
          # buildozer license 目录（关键！）
          ANDROID_LICENSE_DIR: /usr/local/lib/android/sdk/licenses

      - name: Show output
        if: success()
        run: |
          echo "=== APK files ==="
          ls -lh bin/*.apk 2>/dev/null || echo "No APK found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netease-comment-viewer-apk
          path: bin/*.apk
          retention-days: 30

      - name: Show error log
        if: failure()
        run: |
          echo "=== Buildozer log (last 100 lines) ==="
          tail -n 100 .buildozer/logs/buildozer.log 2>/dev/null || echo "No buildozer log"
