name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.x'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            pkg-config \
            tcl \
            tk \
            wget \
            make \
            gcc \
            g++ \
            ccache

      - name: Set up Android SDK + tools for buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform
          ln -sfn /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
                 ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

      - name: Accept Android SDK licenses
        run: |
          export SDK=~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $SDK/tools/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $SDK/tools/bin/sdkmanager \
            "build-tools;37.0.0" "platforms;android-34" \
            --sdk_root=$SDK 2>/dev/null || true

      - name: Install Python packages
        run: |
          pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.36
          pip install requests
          pip install buildozer==1.5.0
          pip install python-for-android

      - name: Build APK - download + patch + compile all in one wrapper
        run: |
          cat > /tmp/p4a_build.py << 'PYEOF'
          import pythonforandroid.recipe as p4a_r
          import pythonforandroid.util as p4a_u
          import requests, os, time, sys

          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          PKGS = ".buildozer/android/platform/build/packages"

          # ---------- 0. Mirror map: try multiple sources for each package ----------
          import urllib.request, urllib.error

          # SourceForge is blocked by GitHub Actions - use mirrors
          MIRROR_GROUPS = {
              "freetype": [
                  "https://github.com/freetype/freetype/archive/refs/tags/VER-2-10-1.tar.gz",
                  "https://ftp.acc.umu.se/mirror/freetype.org/freetype/freetype-2.10.1.tar.gz",
                  "https://sourceforge.mirrorservice.org/f/fe/freetype/freetype2/2.10.1/freetype-2.10.1.tar.gz",
                  "https://mirrors.kernel.org/gentoo/distfiles/freetype-2.10.1.tar.gz",
              ],
              "sdl2_ttf": [
                  "https://www.libsdl.org/projects/SDL_ttf/release/SDL2_ttf-2.0.15.tar.gz",
                  "https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.0.15/SDL2_ttf-2.0.15.tar.gz",
              ],
              "libpng": [
                  "https://github.com/glennrp/libpng/releases/download/v1.6.37/libpng-1.6.37.tar.gz",
                  "https://mirror.koddos.net/pub/software/graphics/libpng/libpng-1.6.37.tar.gz",
                  "https://ftp.acc.umu.se/mirror/www.informatik.hu-berlin.de/pub/Mirrors/eftp.lip6.fr/pub/pcgs/graphics/png/src/libpng-1.6.37.tar.gz",
                  "http://libpng.org/files/pub/png/libpng-1.6.37.tar.gz",
              ],
          }

          def multi_source_download(urls, dest, min_size=50000, max_retries=4):
              """Try each URL in order, use requests with retry on HTTP errors."""
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              for url in urls:
                  for attempt in range(max_retries):
                      if os.path.exists(dest) and os.path.getsize(dest) >= min_size:
                          print(f"  [multi] exists: {dest} ({os.path.getsize(dest):,} bytes)")
                          return True
                      print(f"  [multi] trying: {url}")
                      try:
                          r = requests.get(url, headers={"User-Agent": UA}, timeout=120,
                                            allow_redirects=True, stream=True)
                          r.raise_for_status()
                          data = b"".join(r.iter_content(chunk_size=65536))
                          sz = len(data)
                          if sz < 5000 and data[:1] == b"<":
                              print(f"  [multi] HTML page ({sz}B), next mirror...")
                              break  # try next URL
                          if sz < min_size:
                              print(f"  [multi] too small ({sz}B), next mirror...")
                              break
                          with open(dest, 'wb') as f:
                              f.write(data)
                          print(f"  [multi] SUCCESS: {dest} = {sz:,} bytes (from {url})")
                          return True
                      except Exception as e:
                          print(f"  [multi] retry {attempt+1}/{max_retries}: {e}")
                          if attempt < max_retries-1:
                              time.sleep(2**attempt)
                  print(f"  [multi] all retries exhausted for {url}, trying next mirror...")
              return False

          def pre_ensure(key, dest, min_size=50000):
              urls = MIRROR_GROUPS.get(key, [])
              if not urls:
                  print(f"[pre-ERROR] No mirrors defined for key: {key}")
                  sys.exit(1)
              if not multi_source_download(urls, dest, min_size):
                  print(f"[pre-ERROR] Could not download {key} from any mirror")
                  sys.exit(1)

          # freetype
          pre_ensure("freetype",
              f"{PKGS}/freetype/freetype-2.10.1.tar.gz")

          # sdl2_ttf
          pre_ensure("sdl2_ttf",
              f"{PKGS}/sdl2_ttf/sdl2_ttf-2.0.15.tar.gz")

          # libpng
          pre_ensure("libpng",
              f"{PKGS}/libpng/v1.6.37.tar.gz")

          print("\n=== Pre-downloaded packages ===")
          for root, dirs, files in os.walk(PKGS):
              for f in sorted(files):
                  if f.endswith(('.tar.gz', '.zip', '.tar.xz')):
                      p = os.path.join(root, f)
                      print(f"  {p}  {os.path.getsize(p):,} bytes")

          # SourceForge domain aliases for mirror routing
          SF_KEYS = {
              "downloads.sourceforge.net/project/freetype":  "freetype",
              "sourceforge.net/projects/libpng":             "libpng",
          }

          def route_mirror(url):
              """Return a list of URLs to try: original first, then mirrors."""
              out = [url]
              for domain, key in SF_KEYS.items():
                  if domain in url and key in MIRROR_GROUPS:
                      out += MIRROR_GROUPS[key]
              return out

          # ---------- 2. Patch p4a's download_file ----------
          _orig = p4a_r.Recipe.download_file
          def patched_download_file(self, url, filename, cwd=None, retry=True, chunk_size=8192):
              if cwd:
                  filename = os.path.join(cwd, filename)
              dn = os.path.dirname(filename)
              if dn:
                  p4a_u.ensure_dir(dn)
              if os.path.exists(filename) and os.path.getsize(filename) > 10000:
                  print(f"  [patch] exists, skip: {filename}")
                  return
              urls_to_try = route_mirror(url)
              for u in urls_to_try:
                  print(f"  [patch] trying: {u}")
                  for attempt in range(5):
                      try:
                          r = requests.get(u, headers={"User-Agent": UA}, timeout=120,
                                            allow_redirects=True, stream=True)
                          r.raise_for_status()
                          data = b"".join(r.iter_content(chunk_size=chunk_size*8))
                          if len(data) < 5000 and data[:1] == b"<":
                              print(f"  [patch] HTML page ({len(data)}B) - next mirror")
                              break  # try next URL in route_mirror list
                          with open(filename, "wb") as f:
                              f.write(data)
                          print(f"  [patch OK] {filename} = {len(data):,} bytes (from {u})")
                          return
                      except Exception as e:
                          print(f"  [patch retry {attempt+1}/5] {e}")
                          if attempt < 4:
                              time.sleep(2**attempt)
                  print(f"  [patch] exhausted for {u}, trying next...")
              print("[patch] all mirrors failed, fallback to urllib")
              _orig(self, url, filename, cwd=cwd)
          p4a_r.Recipe.download_file = patched_download_file
          print("\n[p4a-patch] patched successfully, now running toolchain...")

          # ---------- 3. Run p4a toolchain ----------
          sys.argv = [
              "toolchain.py",
              "create",
              "--dist-name=netease_comment_viewer",
              "--bootstrap=sdl2",
              "--requirements=python3,kivy==2.3.0,KivyMD==1.1.1,pillow,urllib3",
              "--arch=arm64-v8a",
              "--arch=armeabi-v7a",
              "--android-api=34",
              "--ndk-api=21",
              "--copy-libs",
              "--color=always",
              "--storage-dir=.buildozer/android/platform/build",
              "--debug",
          ]
          from pythonforandroid.toolchain import main
          main()
          PYEOF

          ANDROIDNDK=/usr/local/lib/android/sdk/ndk/27.3.13750724 \
          ANDROIDSDK=/usr/local/lib/android/sdk \
          ANDROID_HOME=/usr/local/lib/android/sdk \
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk \
          ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724 \
          P4A_ANDROID_NDK_API=21 \
            python3 /tmp/p4a_build.py 2>&1

      - name: Find and copy APK
        if: success()
        run: |
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          mkdir -p bin
          cp .buildozer/android/platform/build/*/armeabi-v7a/*/dist/*.apk bin/ 2>/dev/null || \
          cp .buildozer/android/platform/build/*/armeabi-v7a/*/*.apk bin/ 2>/dev/null || \
          find .buildozer -name "*.apk" -exec cp {} bin/ \; 2>/dev/null || true
          echo "=== APKs in bin/ ==="
          ls -lh bin/*.apk 2>/dev/null || echo "No APK found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netease-comment-viewer-apk
          path: bin/*.apk
          retention-days: 30

      - name: Show error log
        if: failure()
        run: |
          echo "=== build artifacts ==="
          find .buildozer -name "*.apk" 2>/dev/null | head -5
          echo ""
          tail -n 100 .buildozer/logs/buildozer.log 2>/dev/null || echo "No log"
