name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_API: "34"
      ANDROID_NDK_VERSION: "25.2.9519653"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      USE_CCACHE: "1"
      P4A_ANDROID_NDK_API: "21"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check required files
        shell: bash
        run: |
          set -euxo pipefail
          test -f buildozer.spec || { echo "buildozer.spec not found in repository root"; exit 1; }

      - name: Show runner Android env
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la /usr/local/lib/android/sdk || true

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            pkg-config \
            autoconf \
            automake \
            libtool \
            cmake \
            ccache \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            tcl \
            tk

      - name: Prepare Android SDK / NDK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" >/dev/null

          echo "ANDROIDNDK=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Install Python packages
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install Cython==0.29.36 requests buildozer==1.5.0
          python -m pip install "git+https://github.com/kivy/python-for-android.git@v2024.01.21"

      - name: Create python-for-android download patch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .github/ci_patch
          cat > .github/ci_patch/sitecustomize.py << 'PYEOF'
          import os
          import time

          def _install_patch():
              try:
                  import requests
                  import pythonforandroid.recipe as p4a_r
              except Exception:
                  return

              Recipe = p4a_r.Recipe
              original = Recipe.download_file
              if getattr(original, "_ci_patched", False):
                  return

              UA = (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/124.0.0.0 Safari/537.36"
              )

              MIRROR_GROUPS = {
                  "freetype": [
                      "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.10.1.tar.gz",
                      "https://osdn.net/projects/sfnet_freetype/downloads/freetype2/2.10.1/freetype-2.10.1.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/graphics/freetype/freetype-2.10.1.tar.gz",
                      "https://mirrors.kernel.org/gentoo/distfiles/freetype-2.10.1.tar.gz",
                  ],
                  "libpng": [
                      "https://osdn.net/projects/sfnet_libpng/downloads/libpng16/1.6.37/libpng-1.6.37.tar.gz",
                      "https://mirror.koddos.net/pub/software/graphics/libpng/libpng-1.6.37.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/graphics/png/libpng-1.6.37.tar.gz",
                  ],
                  "sdl2_mixer": [
                      "https://www.libsdl.org/release/SDL2_mixer-2.6.3.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_mixer-2.6.3.tar.gz",
                  ],
                  "sdl2_image": [
                      "https://www.libsdl.org/release/SDL2_image-2.8.0.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_image-2.8.0.tar.gz",
                  ],
                  "sdl2_ttf": [
                      "https://www.libsdl.org/release/SDL2_ttf-2.20.2.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_ttf-2.20.2.tar.gz",
                  ],
              }

              ROUTE_RULES = {
                  "download.savannah.gnu.org": "freetype",
                  "download-mirror.savannah.gnu.org": "freetype",
                  "sourceforge.net/projects/freetype": "freetype",
                  "downloads.sourceforge.net/project/freetype": "freetype",
                  "sourceforge.net/projects/libpng": "libpng",
                  "downloads.sourceforge.net/project/libpng": "libpng",
                  "github.com/libsdl-org/SDL_mixer": "sdl2_mixer",
                  "github.com/libsdl-org/SDL_image": "sdl2_image",
                  "github.com/libsdl-org/SDL_ttf": "sdl2_ttf",
              }

              def route_mirrors(url: str):
                  urls = [url]
                  for key, group in ROUTE_RULES.items():
                      if key in url:
                          urls.extend(MIRROR_GROUPS.get(group, []))
                          break
                  seen = set()
                  ordered = []
                  for u in urls:
                      if u not in seen:
                          ordered.append(u)
                          seen.add(u)
                  return ordered

              def looks_like_html(path: str) -> bool:
                  try:
                      with open(path, "rb") as f:
                          head = f.read(512).lstrip()
                      return head.startswith(b"<")
                  except Exception:
                      return False

              def patched_download_file(self, url, target, cwd=None):
                  if not isinstance(url, str) or not url.startswith(("http://", "https://")):
                      return original(self, url, target, cwd=cwd)

                  target_path = os.path.join(cwd, target) if cwd else target
                  target_path = os.path.abspath(target_path)
                  os.makedirs(os.path.dirname(target_path), exist_ok=True)

                  last_err = None
                  for candidate in route_mirrors(url):
                      print(f"[patch-dl] trying: {candidate}", flush=True)
                      for attempt in range(5):
                          try:
                              if os.path.exists(target_path):
                                  os.remove(target_path)

                              with requests.get(
                                  candidate,
                                  headers={"User-Agent": UA},
                                  timeout=(30, 180),
                                  allow_redirects=True,
                                  stream=True,
                              ) as r:
                                  r.raise_for_status()
                                  with open(target_path, "wb") as f:
                                      for chunk in r.iter_content(chunk_size=65536):
                                          if chunk:
                                              f.write(chunk)

                              if not os.path.isfile(target_path):
                                  raise RuntimeError(f"download target not created: {target_path}")

                              if os.path.getsize(target_path) < 4096 and looks_like_html(target_path):
                                  raise RuntimeError("mirror returned HTML instead of archive")

                              print(f"[patch-dl] OK -> {target_path}", flush=True)
                              return target_path

                          except Exception as e:
                              last_err = e
                              print(f"[patch-dl] retry {attempt + 1}/5 failed: {e}", flush=True)
                              if attempt < 4:
                                  time.sleep(2 ** attempt)

                      print(f"[patch-dl] mirror exhausted: {candidate}", flush=True)

                  raise last_err if last_err else RuntimeError(f"failed to download: {url}")

              patched_download_file._ci_patched = True
              Recipe.download_file = patched_download_file

          try:
              _install_patch()
          except Exception as e:
              print(f"[sitecustomize] patch skipped: {e}", flush=True)
          PYEOF

      - name: Build debug APK
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/ci_patch
        run: |
          set -euxo pipefail

          export ANDROIDSDK="${ANDROID_SDK_ROOT}"
          export ANDROIDNDK="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}"

          python -V
          pip -V
          buildozer --version

          buildozer android clean || true
          buildozer -v android debug 2>&1 | tee buildozer-ci.log

          echo "=== search APK after build ==="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) | sort || true
          ls -lah bin || true

      - name: Collect APKs
        id: collect
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          shopt -s nullglob globstar

          files=(bin/*.apk .buildozer/**/*.apk)
          found=0

          for f in "${files[@]}"; do
            if [[ -f "$f" ]]; then
              cp -f "$f" dist/
              found=1
            fi
          done

          if [[ "$found" -eq 0 ]]; then
            echo "No APK found after successful build step."
            find . -type f \( -name "*.apk" -o -name "*.aab" \) | sort || true
            exit 1
          fi

          echo "=== APKs in dist ==="
          ls -lah dist
          echo "apk_found=true" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: steps.collect.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            buildozer-ci.log
            .buildozer/**/*.log
            .buildozer/android/platform/python-for-android/build/**/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "=== buildozer-ci.log tail ==="
          tail -n 300 buildozer-ci.log 2>/dev/null || true
          echo
          echo "=== .buildozer log files ==="
          find .buildozer -type f | sort | tail -n 200 || true
