name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_API: "34"
      ANDROID_NDK_VERSION: "25.2.9519653"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      USE_CCACHE: "1"
      P4A_ANDROID_NDK_API: "21"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check required files
        shell: bash
        run: |
          set -euxo pipefail
          test -f buildozer.spec || { echo "buildozer.spec not found in repository root"; exit 1; }

      - name: Show runner Android env
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT" || true

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            pkg-config \
            autoconf \
            automake \
            libtool \
            cmake \
            ccache \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            tcl \
            tk

      - name: Prepare Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          run_sdkmanager() {
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" "$@" >/tmp/sdkmanager.log 2>&1
            local sdk_status=${PIPESTATUS[1]}
            set -o pipefail
            return "$sdk_status"
          }

          echo "=== accept licenses ==="
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true

          echo "=== install SDK packages ==="
          run_sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;34.0.0" \
            "build-tools;37.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "=== accept licenses again (post-install) ==="
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true

          echo "ANDROIDNDK=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          echo "=== verify installations ==="
          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"
          test -d "${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          test -d "${ANDROID_SDK_ROOT}/build-tools/37.0.0"
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          echo "All required dirs exist"

          echo "=== create bare build-tools symlink (buildozer default SDK detection) ==="
          BT_DIR="${ANDROID_SDK_ROOT}/build-tools"
          echo "BT_DIR=$BT_DIR"
          ls -la "$BT_DIR/"
          BT_VER="$(ls "$BT_DIR" | grep -E '^[0-9]' | sort -V | tail -1)"
          echo "BT_VER=$BT_VER"
          if [[ -n "$BT_VER" ]]; then
            if [[ -L "${BT_DIR}/build-tools" ]]; then
              echo "symlink already exists: $(readlink "${BT_DIR}/build-tools")"
            elif [[ -d "${BT_DIR}/build-tools" ]]; then
              echo "build-tools dir already exists (not a symlink)"
            else
              ln -s "${BT_DIR}/${BT_VER}" "${BT_DIR}/build-tools"
              echo "Created symlink: build-tools -> $BT_VER"
            fi
          else
            echo "ERROR: no build-tools version found in $BT_DIR"
          fi
          echo "=== final build-tools state ==="
          ls -la "$BT_DIR/"

      - name: Install Python packages
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install Cython==0.29.36 requests
          python -m pip install "git+https://github.com/kivy/python-for-android.git@v2024.01.21"

      - name: Create p4a CI patch file
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .github/ci_patch
          cat > .github/ci_patch/ci_patch.py << 'PYEOF'
          import os, sys, time, posixpath, shutil, zipfile

          # Fixed at script injection time — the cwd when p4a/buildozer is launched.
          _LAUNCH_DIR = os.path.abspath(os.getcwd())

          print("[ci-patch] CI patch module loaded", flush=True)

          def install_patch():
              import requests
              import pythonforandroid.recipe as p4a_r
              Recipe = p4a_r.Recipe
              print(f"[ci-patch] Recipe class: {Recipe}", flush=True)
              print(f"[ci-patch] Recipe.download_if_necessary: {Recipe.download_if_necessary}", flush=True)
              print(f"[ci-patch] installing patch...", flush=True)

              UA = (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/124.0.0.0 Safari/537.36"
              )

              MIRROR_GROUPS = {
                  "freetype": [
                      "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.10.1.tar.gz",
                      "https://osdn.net/projects/sfnet_freetype/downloads/freetype2/2.10.1/freetype-2.10.1.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/graphics/freetype/freetype-2.10.1.tar.gz",
                      "https://mirrors.kernel.org/gentoo/distfiles/freetype-2.10.1.tar.gz",
                  ],
                  "libpng": [
                      "https://osdn.net/projects/sfnet_libpng/downloads/libpng16/1.6.37/libpng-1.6.37.tar.gz",
                      "https://mirror.koddos.net/pub/software/graphics/libpng/libpng-1.6.37.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/graphics/png/libpng-1.6.37.tar.gz",
                  ],
                  "sdl2_mixer": [
                      "https://www.libsdl.org/release/SDL2_mixer-2.6.3.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_mixer-2.6.3.tar.gz",
                  ],
                  "sdl2_image": [
                      "https://www.libsdl.org/release/SDL2_image-2.8.0.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_image-2.8.0.tar.gz",
                  ],
                  "sdl2_ttf": [
                      "https://www.libsdl.org/release/SDL2_ttf-2.20.2.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_ttf-2.20.2.tar.gz",
                  ],
              }

              ROUTE_RULES = {
                  "download.savannah.gnu.org": "freetype",
                  "download-mirror.savannah.gnu.org": "freetype",
                  "sourceforge.net/projects/freetype": "freetype",
                  "downloads.sourceforge.net/project/freetype": "freetype",
                  "sourceforge.net/projects/libpng": "libpng",
                  "downloads.sourceforge.net/project/libpng": "libpng",
                  "github.com/libsdl-org/SDL_mixer": "sdl2_mixer",
                  "github.com/libsdl-org/SDL_image": "sdl2_image",
                  "github.com/libsdl-org/SDL_ttf": "sdl2_ttf",
              }

              def route_mirrors(url):
                  urls = [url]
                  for key, group in ROUTE_RULES.items():
                      if key in url:
                          urls.extend(MIRROR_GROUPS.get(group, []))
                          break
                  seen = set()
                  ordered = []
                  for u in urls:
                      if u not in seen:
                          ordered.append(u)
                          seen.add(u)
                  return ordered

              def looks_like_html(path):
                  try:
                      with open(path, "rb") as f:
                          head = f.read(512).lstrip()
                      return head.startswith(b"<")
                  except Exception:
                      return False

              def _get_pkg_dir(recipe_self):
                  raw_pkg_path = getattr(recipe_self.ctx, "packages_path", "packages")
                  if os.path.isabs(raw_pkg_path):
                      return os.path.join(raw_pkg_path, recipe_self.name)
                  return os.path.join(_LAUNCH_DIR, raw_pkg_path, recipe_self.name)

              def _safe_move(src, dst):
                  if os.path.exists(dst):
                      if os.path.isdir(dst):
                          shutil.rmtree(dst)
                      else:
                          os.remove(dst)
                  shutil.move(src, dst)

              def _unpack_to_build_dir(redirected, build_dir):
                  """Extract archive to build_dir, flatten single-wrapper dir."""
                  extract_to = os.path.join(build_dir, "temp_extract")
                  if os.path.exists(extract_to):
                      shutil.rmtree(extract_to)
                  os.makedirs(extract_to, exist_ok=True)
                  print(f"[ci-patch] extracting {redirected} -> {extract_to}", flush=True)
                  shutil.unpack_archive(redirected, extract_to)
                  inner = os.listdir(extract_to)
                  print(f"[ci-patch] inner: {inner}", flush=True)
                  if len(inner) == 1:
                      inner_path = os.path.join(extract_to, inner[0])
                      if os.path.isdir(inner_path):
                          for item in os.listdir(inner_path):
                              _safe_move(os.path.join(inner_path, item), os.path.join(build_dir, item))
                          os.rmdir(inner_path)
                      else:
                          _safe_move(inner_path, os.path.join(build_dir, inner[0]))
                  for item in os.listdir(extract_to):
                      _safe_move(os.path.join(extract_to, item), os.path.join(build_dir, item))
                  os.rmdir(extract_to)
                  print(f"[ci-patch] done: {os.listdir(build_dir)[:5]}", flush=True)

              def _do_unpack_all_archs(recipe_self):
                  """Download finished: extract source to every arch-specific build_dir."""
                  filename = posixpath.basename(recipe_self.versioned_url.split("?")[0])
                  redirected = os.path.abspath(os.path.join(_get_pkg_dir(recipe_self), filename))
                  ctx = getattr(recipe_self, "ctx", None)
                  if ctx and hasattr(ctx, "archs") and ctx.archs:
                      archs_to_unpack = ctx.archs
                  else:
                      archs_to_unpack = ["arm64-v8a", "armeabi-v7a"]
                  for arch in archs_to_unpack:
                      raw_bd = recipe_self.get_build_dir(arch)
                      build_dir = os.path.abspath(raw_bd) if os.path.isabs(raw_bd) else os.path.join(_LAUNCH_DIR, raw_bd)
                      print(f"[ci-patch] unpack_all {recipe_self.name} for arch={arch} build_dir={build_dir}", flush=True)
                      _unpack_to_build_dir(redirected, build_dir)

              _orig_dlin = Recipe.download_if_necessary

              def _patched_dlin(recipe_self, arch=None):
                  recipe_name = getattr(recipe_self, "name", "?")
                  print(f"[ci-patch-dlin] ENTER recipe={recipe_name} arch={arch}", flush=True)
                  if not getattr(recipe_self, "url", None):
                      print(f"[ci-patch-dlin] no url attr -> original", flush=True)
                      return _orig_dlin(recipe_self)
                  filename = posixpath.basename(recipe_self.versioned_url.split("?")[0])
                  pkg_dir = _get_pkg_dir(recipe_self)
                  os.makedirs(pkg_dir, exist_ok=True)
                  target_abs = os.path.abspath(os.path.join(pkg_dir, filename))
                  mark_abs = os.path.abspath(os.path.join(pkg_dir, ".mark-" + filename))
                  if os.path.isfile(mark_abs):
                      print(f"[ci-patch-dlin] skip (marked): {filename}", flush=True)
                      _do_unpack_all_archs(recipe_self)
                      return
                  print(f"[ci-patch-dlin] downloading {recipe_self.versioned_url} -> {target_abs}", flush=True)
                  last_err = None
                  for candidate in route_mirrors(recipe_self.versioned_url):
                      for attempt in range(5):
                          try:
                              if os.path.exists(target_abs):
                                  os.remove(target_abs)
                              with requests.get(candidate, headers={"User-Agent": UA},
                                                timeout=(30, 180), allow_redirects=True, stream=True) as r:
                                  r.raise_for_status()
                                  with open(target_abs, "wb") as f:
                                      for chunk in r.iter_content(chunk_size=65536):
                                          if chunk:
                                              f.write(chunk)
                              sz = os.path.getsize(target_abs)
                              if sz < 4096 and looks_like_html(target_abs):
                                  raise RuntimeError("mirror returned HTML")
                              print(f"[ci-patch-dlin] OK {sz}B: {candidate}", flush=True)
                              with open(mark_abs, "w") as mf:
                                  mf.write(candidate)
                              os.sync()
                              _do_unpack_all_archs(recipe_self)
                              return
                          except Exception as e:
                              last_err = e
                              print(f"[ci-patch-dlin] retry {attempt+1}/5 failed: {e}", flush=True)
                              if attempt < 4:
                                  time.sleep(2 ** attempt)
                  raise last_err

              # Only patch download_if_necessary. unpack is NOT patched — we pre-populate
              # ALL arch build_dirs at download time, so unpack is never needed.
              Recipe.download_if_necessary = _patched_dlin
              print("[ci-patch] patches installed successfully", flush=True)

          install_patch()
          PYEOF
          echo "ci_patch.py created"

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROIDSDK="${ANDROID_SDK_ROOT}"
          export ANDROIDNDK="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}"

          echo "=== env vars ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"

          echo "=== SDK contents ==="
          ls -la "$ANDROID_SDK_ROOT/build-tools/" || echo "no build-tools dir"
          ls -la "$ANDROID_SDK_ROOT/platforms/" || echo "no platforms dir"

          echo "=== ci_patch.py exists? ==="
          ls -la .github/ci_patch/
          head -3 .github/ci_patch/ci_patch.py

          echo "=== pre-check: png build dirs (both arches) ==="
          ls -la ~/.local/share/python-for-android/build/other_builds/png/ 2>/dev/null || echo "no png dir in other_builds"
          echo "---"
          ls -la ~/.local/share/python-for-android/packages/png/ 2>/dev/null || echo "no png dir in packages"

          echo "=== clean dists + wipe build cache ==="
          python -c "import sys; sys.path.insert(0,'.github/ci_patch'); import ci_patch" || true
          python -m pythonforandroid.toolchain clean_dists 2>&1 || true
          rm -rf ~/.local/share/python-for-android/build/other_builds/
          rm -rf ~/.local/share/python-for-android/build/bootstrap_builds/
          echo "=== wipe hostpython3 build dir (residual Grammar/Lib/etc cause os.rename errors) ==="
          rm -rf ~/.local/share/python-for-android/build/other_builds/hostpython3/
          rm -rf ~/.local/share/python-for-android/build/bootstrap_builds/hostpython3/
          echo "Build Cache wiped."

          echo "=== verify patch installed ==="
          python -c "import sys; sys.path.insert(0,'.github/ci_patch'); import ci_patch; import pythonforandroid.recipe as r; print('Recipe.download_if_necessary:', r.Recipe.download_if_necessary)"

          echo "=== build APK with p4a toolchain ==="
          # IMPORTANT: import ci_patch BEFORE running p4a toolchain so the patch
          # is installed before p4a's Recipe class is ever referenced.
          python -c "import sys; sys.path.insert(0, '.github/ci_patch'); import ci_patch; from pythonforandroid.toolchain import main; sys.argv = ['','apk','--debug','--bootstrap','sdl2','--android-api','34','--ndk-api','21','--requirements','python3,kivy==2.3.0,KivyMD==1.1.1,pillow,urllib3','--arch','arm64-v8a','--arch','armeabi-v7a']; main()" 2>&1 | tee buildozer-ci.log

          echo "=== post-build png dir state (armeabi-v7a) ==="
          find ~/.local/share/python-for-android/build/other_builds/png/ -type f -name "configure" 2>/dev/null || echo "no configure found"
          find ~/.local/share/python-for-android/build/other_builds/png/ -type d 2>/dev/null | head -20 || echo "no png dirs"

          echo "=== search APK after build ==="
          # p4a toolchain.py puts APKs in .buildozer/android/platform/build/dists/{app_name}/bin/
          find .buildozer -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | sort || true
          ls -lah .buildozer/android/platform/build/dists/ 2>/dev/null || true

      - name: Collect APKs
        id: collect
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          shopt -s nullglob globstar
          # p4a toolchain.py outputs to .buildozer/android/platform/build/dists/{name}/bin/
          files=(.buildozer/android/platform/build/dists/*/bin/*.apk .buildozer/**/*.apk)
          found=0

          for f in "${files[@]}"; do
            if [[ -f "$f" ]]; then
              cp -f "$f" dist/
              found=1
            fi
          done

          if [[ "$found" -eq 0 ]]; then
            echo "No APK found after successful build step."
            find . -type f \( -name "*.apk" -o -name "*.aab" \) | sort || true
            exit 1
          fi

          echo "=== APKs in dist ==="
          ls -lah dist || true
          # Also check p4a's dist output dir
          find .buildozer/android/platform/build/dists -name "*.apk" 2>/dev/null || true
          echo "apk_found=true" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: steps.collect.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            buildozer-ci.log
            .buildozer/**/*.log
            .buildozer/android/platform/python-for-android/build/**/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "=== buildozer-ci.log tail (last 500 lines) ==="
          tail -n 500 buildozer-ci.log 2>/dev/null || true
          echo
          echo "=== .buildozer log files ==="
          find .buildozer -type f | sort | tail -n 200 || true
