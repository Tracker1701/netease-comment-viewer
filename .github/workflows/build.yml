name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.x'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            tcl \
            tk \
            wget

      - name: Install Python packages
        run: |
          pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.36
          pip install buildozer==1.5.0

      - name: Accept Android SDK licenses (runner pre-installed SDK)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          echo "=== License files ==="
          ls -la ~/.android/ 2>/dev/null || echo "No .android dir"

      - name: Build debug APK
        run: |
          buildozer android debug --verbose=2
        env:
          BUILDZERP_VERBOSE: 2
          # 使用 runner 预装的 NDK 和 SDK，不重新下载
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724

      - name: Show output
        if: success()
        run: |
          echo "=== APK files ==="
          ls -lh bin/*.apk 2>/dev/null || echo "No APK found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netease-comment-viewer-apk
          path: bin/*.apk
          retention-days: 30

      - name: Show error log
        if: failure()
        run: |
          echo "=== Buildozer log (last 100 lines) ==="
          tail -n 100 .buildozer/logs/buildozer.log 2>/dev/null || echo "No buildozer log"
