name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.x'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config \
            tcl \
            tk \
            wget

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p ~/android-sdk/cmdline-tools
          cd ~/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=~/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=~/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:~/android-sdk/cmdline-tools/latest/bin:~/android-sdk/platform-tools" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME=~/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses 2>/dev/null || true
          echo "=== License files ==="
          ls -la ~/.android/ 2>/dev/null || echo "No .android dir"

      - name: Install Python packages
        run: |
          pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.36
          pip install buildozer==1.5.0

      - name: Configure buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform
          mkdir -p ~/.buildozer/android/sdk
          mkdir -p ~/.buildozer/android/ndk
          # Point buildozer to our SDK
          echo "[buildozer]" >> buildozer.spec
          echo "android.sdk_path = $HOME/android-sdk" >> buildozer.spec

      - name: Build debug APK
        run: |
          buildozer android debug --verbose=2
        env:
          BUILDZERP_VERBOSE: 2

      - name: Show output
        if: success()
        run: |
          echo "=== APK files ==="
          ls -lh bin/*.apk 2>/dev/null || echo "No APK found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netease-comment-viewer-apk
          path: bin/*.apk
          retention-days: 30

      - name: Show error log
        if: failure()
        run: |
          echo "=== Buildozer log (last 80 lines) ==="
          tail -n 80 .buildozer/logs/buildozer.log 2>/dev/null || echo "No buildozer log"
