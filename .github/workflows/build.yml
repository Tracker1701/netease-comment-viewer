name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    env:
      ANDROID_API: "34"
      ANDROID_NDK_VERSION: "25.2.9519653"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      USE_CCACHE: "1"
      P4A_ANDROID_NDK_API: "21"
      PYTHONUNBUFFERED: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check required files
        shell: bash
        run: |
          set -euxo pipefail
          test -f buildozer.spec || { echo "buildozer.spec not found in repository root"; exit 1; }

      - name: Show runner Android env
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT" || true

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            pkg-config \
            autoconf \
            automake \
            libtool \
            cmake \
            ccache \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            tcl \
            tk

      - name: Prepare Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          run_sdkmanager() {
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" "$@" >/tmp/sdkmanager.log 2>&1
            local sdk_status=${PIPESTATUS[1]}
            set -o pipefail
            return "$sdk_status"
          }

          echo "=== accept licenses ==="
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true

          echo "=== install SDK packages ==="
          run_sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;34.0.0" \
            "build-tools;37.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "=== accept licenses again (post-install) ==="
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true

          echo "ANDROIDNDK=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          echo "=== verify installations ==="
          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"
          test -d "${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          test -d "${ANDROID_SDK_ROOT}/build-tools/37.0.0"
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          echo "All required dirs exist"

          echo "=== create bare build-tools symlink (buildozer default SDK detection) ==="
          BT_DIR="${ANDROID_SDK_ROOT}/build-tools"
          echo "BT_DIR=$BT_DIR"
          ls -la "$BT_DIR/"
          BT_VER="$(ls "$BT_DIR" | grep -E '^[0-9]' | sort -V | tail -1)"
          echo "BT_VER=$BT_VER"
          if [[ -n "$BT_VER" ]]; then
            if [[ -L "${BT_DIR}/build-tools" ]]; then
              echo "symlink already exists: $(readlink "${BT_DIR}/build-tools")"
            elif [[ -d "${BT_DIR}/build-tools" ]]; then
              echo "build-tools dir already exists (not a symlink)"
            else
              ln -s "${BT_DIR}/${BT_VER}" "${BT_DIR}/build-tools"
              echo "Created symlink: build-tools -> $BT_VER"
            fi
          else
            echo "ERROR: no build-tools version found in $BT_DIR"
          fi
          echo "=== final build-tools state ==="
          ls -la "$BT_DIR/"

      - name: Install Python packages
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install Cython==0.29.36 requests
          python -m pip install "git+https://github.com/kivy/python-for-android.git@v2024.01.21"



      - name: Create p4a CI patch file
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .github/ci_patch
          cat > .github/ci_patch/ci_patch.py << 'PYEOF'
          import os, sys, time, posixpath, shutil

          # Fixed at script injection time — the cwd when p4a/buildozer is launched.
          _LAUNCH_DIR = os.path.abspath(os.getcwd())

          print("[ci-patch] CI patch module loaded", flush=True)

          def install_patch():
              import requests
              import pythonforandroid.recipe as p4a_r
              Recipe = p4a_r.Recipe
              print(f"[ci-patch] installing download patch...", flush=True)

              UA = (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/124.0.0.0 Safari/537.36"
              )

              # Mirror candidates for unreliable origins.
              # IMPORTANT: all candidates for a group must yield the SAME file content
              # (same archive format, same filename when saved to packages/).
              # Candidates that differ in format are listed last as last-resort fallbacks
              # and are only used if all same-format mirrors fail.
              MIRROR_GROUPS = {
                  "freetype": [
                      # .tar.gz mirrors — original is also .tar.gz
                      "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.10.1.tar.gz",
                      "https://mirrors.kernel.org/gentoo/distfiles/freetype-2.10.1.tar.gz",
                      "https://distfiles.gentoo.org/distfiles/freetype-2.10.1.tar.gz",
                  ],
                  "libpng": [
                      # original: github.com/glennrp/libpng/archive/v1.6.37.zip
                      # All mirrors must be .zip so the filename matches what p4a expects
                      "https://github.com/glennrp/libpng/archive/v1.6.37.zip",
                  ],
                  "sdl2_mixer": [
                      "https://www.libsdl.org/release/SDL2_mixer-2.6.3.tar.gz",
                  ],
                  "sdl2_image": [
                      "https://www.libsdl.org/release/SDL2_image-2.8.0.tar.gz",
                  ],
                  "sdl2_ttf": [
                      "https://www.libsdl.org/release/SDL2_ttf-2.20.2.tar.gz",
                  ],
              }

              ROUTE_RULES = {
                  "download.savannah.gnu.org": "freetype",
                  "download-mirror.savannah.gnu.org": "freetype",
                  "sourceforge.net/projects/freetype": "freetype",
                  "downloads.sourceforge.net/project/freetype": "freetype",
                  "sourceforge.net/projects/libpng": "libpng",
                  "downloads.sourceforge.net/project/libpng": "libpng",
                  "github.com/glennrp/libpng": "libpng",
                  "github.com/libsdl-org/SDL_mixer": "sdl2_mixer",
                  "github.com/libsdl-org/SDL_image": "sdl2_image",
                  "github.com/libsdl-org/SDL_ttf": "sdl2_ttf",
              }

              def route_mirrors(url):
                  """Return [url] + mirrors for url, deduped."""
                  urls = [url]
                  for key, group in ROUTE_RULES.items():
                      if key in url:
                          urls.extend(MIRROR_GROUPS.get(group, []))
                          break
                  seen, ordered = set(), []
                  for u in urls:
                      if u not in seen:
                          ordered.append(u)
                          seen.add(u)
                  return ordered

              def looks_like_html(path):
                  try:
                      with open(path, "rb") as f:
                          return f.read(512).lstrip().startswith(b"<")
                  except Exception:
                      return False

              def _archive_valid(path):
                  try:
                      return os.path.isfile(path) and os.path.getsize(path) >= 4096 and not looks_like_html(path)
                  except Exception:
                      return False

              def _get_pkg_dir(recipe_self):
                  raw = getattr(recipe_self.ctx, "packages_path", "packages")
                  base = raw if os.path.isabs(raw) else os.path.join(_LAUNCH_DIR, raw)
                  return os.path.join(base, recipe_self.name)

              _orig_dlin = Recipe.download_if_necessary

              def _patched_dlin(recipe_self, arch=None):
                  recipe_name = getattr(recipe_self, "name", "?")
                  print(f"[ci-patch-dlin] ENTER recipe={recipe_name}", flush=True)
                  if not getattr(recipe_self, "url", None):
                      print(f"[ci-patch-dlin] no url, delegating to original", flush=True)
                      return _orig_dlin(recipe_self)

                  # p4a expects the archive at: packages_path / recipe.name / basename(versioned_url)
                  orig_filename = posixpath.basename(recipe_self.versioned_url.split("?")[0])
                  pkg_dir = _get_pkg_dir(recipe_self)
                  os.makedirs(pkg_dir, exist_ok=True)
                  target_abs = os.path.join(pkg_dir, orig_filename)

                  if _archive_valid(target_abs):
                      print(f"[ci-patch-dlin] cached OK ({os.path.getsize(target_abs)}B): {target_abs}", flush=True)
                      # p4a mark file so it knows we already downloaded
                      mark = os.path.join(pkg_dir, f".mark-{orig_filename}")
                      if not os.path.exists(mark):
                          open(mark, "w").close()
                      return  # let p4a do its own unpack via prepare_build_dir

                  # Stale or missing — remove and re-download
                  if os.path.exists(target_abs):
                      print(f"[ci-patch-dlin] removing stale: {target_abs}", flush=True)
                      os.remove(target_abs)

                  print(f"[ci-patch-dlin] downloading {recipe_self.versioned_url}", flush=True)
                  last_err = None
                  downloaded_ok = False

                  for candidate in route_mirrors(recipe_self.versioned_url):
                      for attempt in range(3):
                          try:
                              if os.path.exists(target_abs):
                                  os.remove(target_abs)
                              with requests.get(candidate, headers={"User-Agent": UA},
                                                timeout=(30, 180), allow_redirects=True,
                                                stream=True) as r:
                                  r.raise_for_status()
                                  with open(target_abs, "wb") as f:
                                      for chunk in r.iter_content(chunk_size=65536):
                                          if chunk:
                                              f.write(chunk)
                              if not _archive_valid(target_abs):
                                  sz = os.path.getsize(target_abs) if os.path.exists(target_abs) else 0
                                  raise RuntimeError(f"file invalid after download (size={sz}B)")
                              sz = os.path.getsize(target_abs)
                              print(f"[ci-patch-dlin] OK {sz}B from {candidate}", flush=True)
                              os.sync()
                              downloaded_ok = True
                              break
                          except Exception as e:
                              last_err = e
                              print(f"[ci-patch-dlin] {candidate} attempt {attempt+1}/3 failed: {e}", flush=True)
                              if attempt < 2:
                                  time.sleep(2 ** attempt)
                      if downloaded_ok:
                          break

                  if not downloaded_ok:
                      raise RuntimeError(
                          f"All mirrors failed for {recipe_self.versioned_url}. Last: {last_err}")

                  # Write p4a mark file so it won't try to re-download
                  mark = os.path.join(pkg_dir, f".mark-{orig_filename}")
                  open(mark, "w").close()
                  os.sync()
                  # Do NOT do our own unpack here — let p4a's prepare_build_dir/unpack handle it

              Recipe.download_if_necessary = _patched_dlin
              print("[ci-patch] download patch installed", flush=True)

          install_patch()
          PYEOF
          echo "ci_patch.py created"

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROIDSDK="${ANDROID_SDK_ROOT}"
          export ANDROIDNDK="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}"

          echo "=== env vars ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"

          echo "=== SDK contents ==="
          ls -la "$ANDROID_SDK_ROOT/build-tools/" || echo "no build-tools dir"
          ls -la "$ANDROID_SDK_ROOT/platforms/" || echo "no platforms dir"

          echo "=== verify source files exist at repo root ==="
          ls -la main.py buildozer.spec

          echo "=== ci_patch.py exists? ==="
          ls -la .github/ci_patch/
          head -3 .github/ci_patch/ci_patch.py

          echo "=== pre-check: png build dirs (both arches) ==="
          ls -la ~/.local/share/python-for-android/build/other_builds/png/ 2>/dev/null || echo "no png dir in other_builds"
          echo "---"
          ls -la ~/.local/share/python-for-android/packages/png/ 2>/dev/null || echo "no png dir in packages"

          echo "=== clean dists + wipe build cache ==="
          python -c "import sys; sys.path.insert(0,'.github/ci_patch'); import ci_patch" || true
          python -m pythonforandroid.toolchain clean_dists 2>&1 || true
          echo "=== FULL wipe: remove empty build dirs so needs_build returns True ==="
          # Delete only EMPTY subdirs; then remove the parent dir too if empty
          for topdir in ~/.local/share/python-for-android/build/other_builds ~/.local/share/python-for-android/build/bootstrap_builds; do
            for subdir in "$topdir"/*/; do
              rm -rf "$subdir" 2>/dev/null || true
            done
            rmdir "$topdir" 2>/dev/null || true
          done
          rm -rf ~/.local/share/python-for-android/build/libs_collections/
          echo "Full build cache wipe done."

          echo "=== verify patch installed ==="
          python -c "import sys; sys.path.insert(0,'.github/ci_patch'); import ci_patch; import pythonforandroid.recipe as r; print('Recipe.download_if_necessary:', r.Recipe.download_if_necessary)"

          echo "=== inject adaptive icon into p4a bootstrap res (must run before apk step) ==="
          # p4a 'create' initialises the bootstrap but stops before packaging.
          # We copy our density-specific mipmap PNGs + anydpi XML in so aapt
          # picks them up when it later runs during 'apk'.
          python -c "import sys; sys.path.insert(0, '.github/ci_patch'); import ci_patch; from pythonforandroid.toolchain import main; sys.argv = ['','create','--bootstrap','sdl2','--android-api','34','--ndk-api','21','--requirements','python3,kivy==2.3.0,pillow','--arch','arm64-v8a','--dist-name','yunping','--package','org.netease.netease_comment_viewer','--name','云评','--version','1.0.1','--icon','icon.png','--private','.','--add-source','java','--permission','INTERNET','--permission','ACCESS_NETWORK_STATE']; main()" 2>&1 | tee buildozer-create.log || true

          BOOT_RES=$(find ~/.local/share/python-for-android/build/bootstrap_builds \
                          -type d -name res 2>/dev/null | head -1)
          if [[ -n "$BOOT_RES" ]]; then
            echo "Injecting adaptive icon into $BOOT_RES"
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              src="android/res/mipmap-${density}"
              dst="$BOOT_RES/mipmap-${density}"
              if [[ -d "$src" ]]; then
                mkdir -p "$dst"
                cp -v "$src"/*.png "$dst/"
              fi
            done
            mkdir -p "$BOOT_RES/mipmap-anydpi-v26"
            # icon.xml must match the name p4a uses: @mipmap/icon
            cp -v android/res/mipmap-anydpi-v26/icon.xml "$BOOT_RES/mipmap-anydpi-v26/"
            echo "Adaptive icon injection done."
          else
            echo "WARNING: bootstrap res dir not found — adaptive icon may not apply"
            find ~/.local/share/python-for-android/build/bootstrap_builds -maxdepth 5 -type d | head -20 || true
          fi

          echo "=== build APK with p4a toolchain ==="
          # IMPORTANT: import ci_patch BEFORE running p4a toolchain so the patch
          # is installed before p4a's Recipe class is ever referenced.
          python -c "import sys; sys.path.insert(0, '.github/ci_patch'); import ci_patch; from pythonforandroid.toolchain import main; sys.argv = ['','apk','--debug','--bootstrap','sdl2','--android-api','34','--ndk-api','21','--requirements','python3,kivy==2.3.0,pillow','--arch','arm64-v8a','--dist-name','yunping','--package','org.netease.netease_comment_viewer','--name','云评','--version','1.0.1','--icon','icon.png','--private','.','--add-source','java','--permission','INTERNET','--permission','ACCESS_NETWORK_STATE']; main()" 2>&1 | tee buildozer-ci.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "p4a build exit code: $BUILD_EXIT"
          echo "build_exit=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

          if [[ "$BUILD_EXIT" -ne 0 ]]; then
            echo "p4a build FAILED with exit $BUILD_EXIT — skip APK collection and inject"
            exit "$BUILD_EXIT"
          fi

          echo "=== post-build png dir state (armeabi-v7a) ==="
          find ~/.local/share/python-for-android/build/other_builds/png/ -type f -name "configure" 2>/dev/null || echo "no configure found"
          find ~/.local/share/python-for-android/build/other_builds/png/ -type d 2>/dev/null | head -20 || echo "no png dirs"

          echo "=== search APK after build ==="
          # p4a toolchain.py puts APKs in .buildozer/android/platform/build/dists/{app_name}/bin/
          find .buildozer -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | sort || true
          ls -lah .buildozer/android/platform/build/dists/ 2>/dev/null || true

      - name: Collect APKs
        id: collect
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          shopt -s nullglob globstar
          # p4a v2024.01 puts APK in repo root (unnamed_dist_1-*.apk) or .buildozer/ subdir
          files=(./*.apk .buildozer/android/platform/build/dists/*/bin/*.apk .buildozer/**/*.apk)
          found=0

          for f in "${files[@]}"; do
            if [[ -f "$f" ]]; then
              cp -f "$f" dist/
              found=1
            fi
          done

          if [[ "$found" -eq 0 ]]; then
            echo "No APK found after successful build step."
            find . -type f \( -name "*.apk" -o -name "*.aab" \) | sort || true
            exit 1
          fi

          echo "=== APKs in dist ==="
          ls -lah dist || true
          # Also check p4a's dist output dir
          find .buildozer/android/platform/build/dists -name "*.apk" 2>/dev/null || true
          echo "apk_found=true" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: steps.collect.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.collect.outputs.apk_found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "云评 ${{ github.ref_name }}"
          body: |
            ## 云评 ${{ github.ref_name }}

            网易云音乐评论数查看器 Android 版。

            ### 安装方法
            1. 下载下方 APK 文件
            2. 传输到 Android 手机
            3. 打开文件，允许"未知来源"安装

            ### 使用方法
            粘贴网易云音乐的专辑或歌手分享链接，点击「开始查询」即可。

            支持格式：
            - `http://music.163.com/album/165230666/`
            - `http://music.163.com/artist?id=144290`
            - 网易云 App 内直接分享的文本（含链接即可）
          files: dist/*.apk
          draft: false
          prerelease: false

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            buildozer-ci.log
            buildozer-create.log
            .buildozer/**/*.log
            .buildozer/android/platform/python-for-android/build/**/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "=== buildozer-ci.log tail (last 500 lines) ==="
          tail -n 500 buildozer-ci.log 2>/dev/null || true
          echo
          echo "=== .buildozer log files ==="
          find .buildozer -type f | sort | tail -n 200 || true
