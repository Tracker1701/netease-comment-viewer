name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.x'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            tcl \
            tk \
            wget

      - name: Set up Android SDK + tools for buildozer
        run: |
          # buildozer 默认从 ~/.buildozer/android/platform/android-sdk 找 SDK
          # 用软链接指向 runner 的 SDK，并补上 buildozer 期望的 tools/bin 软链接
          mkdir -p ~/.buildozer/android/platform
          ln -sfn /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          # 在软链接指向的目录下创建 tools/bin（buildozer 找这个路径）
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
                 ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
                 ~/.buildozer/android/platform/android-sdk/tools/bin/android.jar 2>/dev/null || true
          echo "=== Buildozer SDK structure ==="
          find ~/.buildozer/android/platform/android-sdk -maxdepth 3 -type l -o -type d | head -20
          echo ""
          echo "=== sdkmanager exists? ==="
          ls -la ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

      - name: Accept Android SDK licenses
        run: |
          export SDK=~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # 接受所有 license（通过 symlink 路径）
          yes | $SDK/tools/bin/sdkmanager --licenses 2>/dev/null || true
          # 显式安装 build-tools（buildozer 需要 37）
          yes | $SDK/tools/bin/sdkmanager \
            "build-tools;37.0.0" "platforms;android-34" \
            --sdk_root=$SDK 2>/dev/null || true
          echo "=== License status ==="
          ls -la ~/.android/ 2>/dev/null
          echo ""
          echo "=== Installed build-tools ==="
          ls $SDK/build-tools/ 2>/dev/null || echo "none"

      - name: Install Python packages
        run: |
          pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.36
          pip install buildozer==1.5.0

      - name: Build debug APK
        run: |
          buildozer android debug --verbose=2
        env:
          BUILDZERP_VERBOSE: 2
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROIDSDK: ~/.buildozer/android/platform/android-sdk
          ANDROID_HOME: ~/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: ~/.buildozer/android/platform/android-sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724

      - name: Show output
        if: success()
        run: |
          echo "=== APK files ==="
          ls -lh bin/*.apk 2>/dev/null || echo "No APK found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netease-comment-viewer-apk
          path: bin/*.apk
          retention-days: 30

      - name: Show error log
        if: failure()
        run: |
          echo "=== Buildozer log (last 100 lines) ==="
          tail -n 100 .buildozer/logs/buildozer.log 2>/dev/null || echo "No buildozer log"
