name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_API: "34"
      ANDROID_NDK_VERSION: "25.2.9519653"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      USE_CCACHE: "1"
      P4A_ANDROID_NDK_API: "21"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check required files
        shell: bash
        run: |
          set -euxo pipefail
          test -f buildozer.spec || { echo "buildozer.spec not found in repository root"; exit 1; }

      - name: Show runner Android env
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT" || true

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            pkg-config \
            autoconf \
            automake \
            libtool \
            cmake \
            ccache \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            tcl \
            tk

      - name: Prepare Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          run_sdkmanager() {
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" "$@" >/tmp/sdkmanager.log 2>&1
            local sdk_status=${PIPESTATUS[1]}
            set -o pipefail
            return "$sdk_status"
          }

          echo "=== accept licenses ==="
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true

          echo "=== install SDK packages ==="
          run_sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;34.0.0" \
            "build-tools;37.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "=== accept licenses again (post-install) ==="
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true

          echo "ANDROIDNDK=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          echo "=== verify installations ==="
          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"
          test -d "${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          test -d "${ANDROID_SDK_ROOT}/build-tools/37.0.0"
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          echo "All required dirs exist"

          echo "=== create bare build-tools symlink (buildozer default SDK detection) ==="
          BT_DIR="${ANDROID_SDK_ROOT}/build-tools"
          echo "BT_DIR=$BT_DIR"
          ls -la "$BT_DIR/"
          BT_VER="$(ls "$BT_DIR" | grep -E '^[0-9]' | sort -V | tail -1)"
          echo "BT_VER=$BT_VER"
          if [[ -n "$BT_VER" ]]; then
            if [[ -L "${BT_DIR}/build-tools" ]]; then
              echo "symlink already exists: $(readlink "${BT_DIR}/build-tools")"
            elif [[ -d "${BT_DIR}/build-tools" ]]; then
              echo "build-tools dir already exists (not a symlink)"
            else
              ln -s "${BT_DIR}/${BT_VER}" "${BT_DIR}/build-tools"
              echo "Created symlink: build-tools -> $BT_VER"
            fi
          else
            echo "ERROR: no build-tools version found in $BT_DIR"
          fi
          echo "=== final build-tools state ==="
          ls -la "$BT_DIR/"

      - name: Install Python packages
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install Cython==0.29.36 requests
          python -m pip install "git+https://github.com/kivy/python-for-android.git@v2024.01.21"

      - name: Create python-for-android download patch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .github/ci_patch
          cat > .github/ci_patch/sitecustomize.py << 'PYEOF'
          import os
          import time
          import posixpath

          # Fixed at script injection time — the cwd when p4a/buildozer is launched.
          # All packages_path operations are resolved relative to this.
          _LAUNCH_DIR = os.path.abspath(os.getcwd())

          def _install_patch():
              try:
                  import requests
                  import pythonforandroid.recipe as p4a_r
              except Exception:
                  return

              Recipe = p4a_r.Recipe
              if getattr(Recipe.download_if_necessary, "_ci_patched", False):
                  return

              UA = (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/124.0.0.0 Safari/537.36"
              )

              MIRROR_GROUPS = {
                  "freetype": [
                      "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.10.1.tar.gz",
                      "https://osdn.net/projects/sfnet_freetype/downloads/freetype2/2.10.1/freetype-2.10.1.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/graphics/freetype/freetype-2.10.1.tar.gz",
                      "https://mirrors.kernel.org/gentoo/distfiles/freetype-2.10.1.tar.gz",
                  ],
                  "libpng": [
                      "https://osdn.net/projects/sfnet_libpng/downloads/libpng16/1.6.37/libpng-1.6.37.tar.gz",
                      "https://mirror.koddos.net/pub/software/graphics/libpng/libpng-1.6.37.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/graphics/png/libpng-1.6.37.tar.gz",
                  ],
                  "sdl2_mixer": [
                      "https://www.libsdl.org/release/SDL2_mixer-2.6.3.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_mixer-2.6.3.tar.gz",
                  ],
                  "sdl2_image": [
                      "https://www.libsdl.org/release/SDL2_image-2.8.0.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_image-2.8.0.tar.gz",
                  ],
                  "sdl2_ttf": [
                      "https://www.libsdl.org/release/SDL2_ttf-2.20.2.tar.gz",
                      "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_ttf-2.20.2.tar.gz",
                  ],
              }

              ROUTE_RULES = {
                  "download.savannah.gnu.org": "freetype",
                  "download-mirror.savannah.gnu.org": "freetype",
                  "sourceforge.net/projects/freetype": "freetype",
                  "downloads.sourceforge.net/project/freetype": "freetype",
                  "sourceforge.net/projects/libpng": "libpng",
                  "downloads.sourceforge.net/project/libpng": "libpng",
                  "github.com/libsdl-org/SDL_mixer": "sdl2_mixer",
                  "github.com/libsdl-org/SDL_image": "sdl2_image",
                  "github.com/libsdl-org/SDL_ttf": "sdl2_ttf",
              }

              def route_mirrors(url: str):
                  urls = [url]
                  for key, group in ROUTE_RULES.items():
                      if key in url:
                          urls.extend(MIRROR_GROUPS.get(group, []))
                          break
                  seen = set()
                  ordered = []
                  for u in urls:
                      if u not in seen:
                          ordered.append(u)
                          seen.add(u)
                  return ordered

              def looks_like_html(path: str) -> bool:
                  try:
                      with open(path, "rb") as f:
                          head = f.read(512).lstrip()
                      return head.startswith(b"<")
                  except Exception:
                      return False

              # ------------------------------------------------------------------
              # PATCH 1: download_if_necessary
              #   - download to packages/{name}/  (where p4a expects it)
              #   - write .mark-{filename} so p4a skips re-download on next run
              # ------------------------------------------------------------------
              _orig_dlin = Recipe.download_if_necessary

              def _patched_dlin(self, arch=None):
                  # Git-based recipes (android, kivy) have no url attribute.
                  # Fall through to the original method for those.
                  if not getattr(self, "url", None):
                      return _orig_dlin(self)

                  # Use versioned_url to derive the actual filename to download.
                  # self.versioned_url has {version} already substituted.
                  filename = posixpath.basename(self.versioned_url.split("?")[0])

                  # Resolve packages_path against _LAUNCH_DIR to avoid p4a's
                  # current_directory() switching cwd and breaking relative paths.
                  raw_pkg_path = getattr(self.ctx, "packages_path", "packages")
                  if os.path.isabs(raw_pkg_path):
                      pkg_dir = os.path.join(raw_pkg_path, self.name)
                  else:
                      pkg_dir = os.path.join(_LAUNCH_DIR, raw_pkg_path, self.name)

                  os.makedirs(pkg_dir, exist_ok=True)
                  target = os.path.join(pkg_dir, filename)
                  target_abs = os.path.abspath(target)

                  mark_path = os.path.join(pkg_dir, ".mark-" + filename)
                  mark_abs = os.path.abspath(mark_path)

                  # Skip if already marked as downloaded
                  if os.path.isfile(mark_abs):
                      print(f"[patch-dl] skip (marked): {filename}", flush=True)
                      return

                  print(f"[patch-dl] {self.versioned_url} -> {target_abs}", flush=True)

                  last_err = None
                  for candidate in route_mirrors(self.versioned_url):
                      print(f"  [patch-dl] trying: {candidate}", flush=True)
                      for attempt in range(5):
                          try:
                              if os.path.exists(target_abs):
                                  os.remove(target_abs)

                              with requests.get(
                                  candidate,
                                  headers={"User-Agent": UA},
                                  timeout=(30, 180),
                                  allow_redirects=True,
                                  stream=True,
                              ) as r:
                                  r.raise_for_status()
                                  with open(target_abs, "wb") as f:
                                      for chunk in r.iter_content(chunk_size=65536):
                                          if chunk:
                                              f.write(chunk)

                              if not os.path.isfile(target_abs):
                                  raise RuntimeError(f"download target not created: {target_abs}")

                              sz = os.path.getsize(target_abs)
                              if sz < 4096 and looks_like_html(target_abs):
                                  raise RuntimeError("mirror returned HTML instead of archive")

                              print(f"  [patch-dl] OK {sz}B: {target_abs}", flush=True)

                              # Write .mark file so p4a won't re-trigger download
                              with open(mark_abs, "w") as mf:
                                  mf.write(candidate)
                              os.sync()

                              # Immediately unpack after download, before returning.
                              # This ensures the archive is extracted to other_builds/
                              # even if p4a's own unpack is skipped (cache hit).
                              # Use globals() for late binding since _patched_unpack
                              # is defined below this function in the source.
                              print(f"[patch-dl] triggering immediate unpack for {self.name}", flush=True)
                              try:
                                  _pu = globals().get("_patched_unpack")
                                  if _pu:
                                      _pu(self, arch or "arm64-v8a")
                                  else:
                                      print(f"[patch-dl] _patched_unpack not yet defined, skipping", flush=True)
                              except Exception as eu:
                                  print(f"[patch-dl] immediate unpack failed: {eu}", flush=True)
                                  import traceback
                                  traceback.print_exc()

                              return

                          except Exception as e:
                              last_err = e
                              print(f"  [patch-dl] retry {attempt + 1}/5 failed: {e}", flush=True)
                              if attempt < 4:
                                  time.sleep(2 ** attempt)

                      print(f"  [patch-dl] mirror exhausted: {candidate}", flush=True)

                  raise last_err if last_err else RuntimeError(f"failed to download: {self.versioned_url}")

              _patched_dlin._ci_patched = True
              Recipe.download_if_necessary = _patched_dlin

              # ------------------------------------------------------------------
              # PATCH 2: unpack
              #   - redirect archive_path to packages/{name}/  (where we downloaded)
              #   - so shutil.unpack_archive finds the file regardless of cwd
              # ------------------------------------------------------------------
              _orig_unpack = Recipe.unpack

              def _patched_unpack(self, arch):
                  # Git-based recipes have no url attribute.
                  if not getattr(self, "url", None):
                      return _orig_unpack(self, arch)

                  # Build the redirected archive path: packages/{name}/{filename}
                  filename = posixpath.basename(self.versioned_url.split("?")[0])
                  raw_pkg_path = getattr(self.ctx, "packages_path", "packages")
                  if os.path.isabs(raw_pkg_path):
                      pkg_dir = os.path.join(raw_pkg_path, self.name)
                  else:
                      pkg_dir = os.path.join(_LAUNCH_DIR, raw_pkg_path, self.name)
                  redirected = os.path.abspath(os.path.join(pkg_dir, filename))

                  if not os.path.isfile(redirected):
                      # Fall back to original path (shouldn't happen)
                      print(f"[patch-unpack] redirect not found, using original: {filename}", flush=True)
                      return _orig_unpack(self, arch)

                  print(f"[patch-unpack] redirecting {filename} -> {redirected}", flush=True)
                  # DEBUG: verify redirected file exists and has expected size
                  sz = os.path.getsize(redirected)
                  print(f"[patch-unpack] redirected file size={sz}", flush=True)
                  if sz < 1000:
                      print(f"[patch-unpack] WARNING: file too small, checking if HTML:", flush=True)
                      with open(redirected, "rb") as f:
                          print(f"  first 200 bytes: {f.read(200)}", flush=True)
                  # DEBUG: inspect zip contents
                  import zipfile
                  try:
                      with zipfile.ZipFile(redirected, "r") as zf:
                          names = zf.namelist()
                          print(f"[patch-unpack] zip contents ({len(names)} entries): {names[:10]}...", flush=True)
                  except Exception as ez:
                      print(f"[patch-unpack] zip inspection failed: {ez}", flush=True)

                  # Call the original unpack with a monkey-patched archive path
                  import shutil
                  build_dir = self.get_build_dir(arch)
                  extract_to = os.path.join(build_dir, "temp_extract_" + self.name)
                  if os.path.exists(extract_to):
                      shutil.rmtree(extract_to)
                  os.makedirs(extract_to, exist_ok=True)
                  shutil.unpack_archive(redirected, extract_to)
                  print(f"[patch-unpack] extracted to {extract_to}, listing:", flush=True)
                  print(f"  {os.listdir(extract_to)}", flush=True)
                  # Move contents up one level (standard p4a behaviour)
                  inner = os.listdir(extract_to)
                  if len(inner) == 1:
                      inner_path = os.path.join(extract_to, inner[0])
                      if os.path.isdir(inner_path):
                          inner_items = os.listdir(inner_path)
                          print(f"[patch-unpack] single inner dir '{inner[0]}', moving: {inner_items}", flush=True)
                          for item in inner_items:
                              os.rename(
                                  os.path.join(inner_path, item),
                                  os.path.join(build_dir, item),
                              )
                          os.rmdir(inner_path)
                      else:
                          os.rename(inner_path, os.path.join(build_dir, inner[0]))
                  for item in os.listdir(extract_to):
                      os.rename(os.path.join(extract_to, item), os.path.join(build_dir, item))
                  os.rmdir(extract_to)
                  print(f"[patch-unpack] build_dir contents after move: {os.listdir(build_dir)}", flush=True)

              _orig_unpack._ci_patched = True
              Recipe.unpack = _patched_unpack

          try:
              _install_patch()
          except Exception as e:
              import traceback
              traceback.print_exc()
              print(f"[sitecustomize] patch error: {e}", flush=True)
          PYEOF

      - name: Build debug APK
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/ci_patch
        run: |
          set -euxo pipefail

          export ANDROIDSDK="${ANDROID_SDK_ROOT}"
          export ANDROIDNDK="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}"

          echo "=== env vars ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "PYTHONPATH=$PYTHONPATH"

          echo "=== SDK contents ==="
          ls -la "$ANDROID_SDK_ROOT/build-tools/" || echo "no build-tools dir"
          ls -la "$ANDROID_SDK_ROOT/platforms/" || echo "no platforms dir"

          echo "=== p4a version ==="
          python -c "import pythonforandroid; print('p4a:', pythonforandroid.__version__)"
          python -c "import pythonforandroid.recipe; print('Recipe module OK')"


          echo "=== clean dists + wipe build cache ==="
          python -m pythonforandroid.toolchain clean_dists 2>&1 || true
          # Also wipe the entire build cache to force re-download and re-unpack.
          # Without this, old (incorrectly unpacked) artifacts in other_builds/
          # cause ./configure not found errors.
          rm -rf ~/.local/share/python-for-android/build/other_builds/
          rm -rf ~/.local/share/python-for-android/build/bootstrap_builds/
          echo "Build cache wiped."

          echo "=== build APK with p4a toolchain ==="
          python -m pythonforandroid.toolchain apk \
            --debug \
            --bootstrap sdl2 \
            --android-api 34 \
            --ndk-api 21 \
            --requirements python3,kivy==2.3.0,KivyMD==1.1.1,pillow,urllib3 \
            --arch arm64-v8a \
            --arch armeabi-v7a \
            2>&1 | tee buildozer-ci.log

          echo "=== search APK after build ==="
          # p4a toolchain.py puts APKs in .buildozer/android/platform/build/dists/{app_name}/bin/
          find .buildozer -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | sort || true
          ls -lah .buildozer/android/platform/build/dists/ 2>/dev/null || true

      - name: Collect APKs
        id: collect
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          shopt -s nullglob globstar
          # p4a toolchain.py outputs to .buildozer/android/platform/build/dists/{name}/bin/
          files=(.buildozer/android/platform/build/dists/*/bin/*.apk .buildozer/**/*.apk)
          found=0

          for f in "${files[@]}"; do
            if [[ -f "$f" ]]; then
              cp -f "$f" dist/
              found=1
            fi
          done

          if [[ "$found" -eq 0 ]]; then
            echo "No APK found after successful build step."
            find . -type f \( -name "*.apk" -o -name "*.aab" \) | sort || true
            exit 1
          fi

          echo "=== APKs in dist ==="
          ls -lah dist || true
          # Also check p4a's dist output dir
          find .buildozer/android/platform/build/dists -name "*.apk" 2>/dev/null || true
          echo "apk_found=true" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: steps.collect.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            buildozer-ci.log
            .buildozer/**/*.log
            .buildozer/android/platform/python-for-android/build/**/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "=== buildozer-ci.log tail (last 500 lines) ==="
          tail -n 500 buildozer-ci.log 2>/dev/null || true
          echo
          echo "=== .buildozer log files ==="
          find .buildozer -type f | sort | tail -n 200 || true
