name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "34"
      ANDROID_NDK_VERSION: "25.2.9519653"
      P4A_DIST_NAME: "netease_comment_viewer"
      P4A_STORAGE_DIR: "${{ github.workspace }}/.buildozer/android/platform/build"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            pkg-config \
            tcl \
            tk \
            wget \
            make \
            gcc \
            g++ \
            git \
            tar \
            ccache \
            autoconf \
            automake \
            libtool \
            cmake

      - name: Prepare Android SDK
        run: |
          export SDK=/usr/local/lib/android/sdk
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | "${SDK}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          yes | "${SDK}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" >/dev/null

          mkdir -p ~/.buildozer/android/platform
          ln -sfn "${SDK}" ~/.buildozer/android/platform/android-sdk

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install Cython==0.29.36 requests buildozer==1.5.0
          python -m pip install "git+https://github.com/kivy/python-for-android.git@v2024.01.21"

      - name: Build APK
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          cat > /tmp/p4a_build.py << 'PYEOF'
          import configparser
          import os
          import sys
          import time
          from urllib.parse import urlparse

          import requests
          import pythonforandroid.recipe as p4a_r

          WORKSPACE = os.environ["GITHUB_WORKSPACE"]
          ANDROID_API = os.environ.get("ANDROID_API", "34")
          P4A_DIST_NAME = os.environ.get("P4A_DIST_NAME", "netease_comment_viewer")
          P4A_STORAGE_DIR = os.environ["P4A_STORAGE_DIR"]
          ANDROID_SDK = os.environ["ANDROIDSDK"]
          ANDROID_NDK = os.environ["ANDROIDNDK"]

          UA = (
              "Mozilla/5.0 (X11; Linux x86_64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/124.0.0.0 Safari/537.36"
          )

          MIRROR_GROUPS = {
              "freetype": [
                  "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.10.1.tar.gz",
                  "https://osdn.net/projects/sfnet_freetype/downloads/freetype2/2.10.1/freetype-2.10.1.tar.gz",
                  "https://ftp.lip6.fr/pub/pcgs/graphics/freetype/freetype-2.10.1.tar.gz",
                  "https://mirrors.kernel.org/gentoo/distfiles/freetype-2.10.1.tar.gz",
              ],
              "libpng": [
                  "https://osdn.net/projects/sfnet_libpng/downloads/libpng16/1.6.37/libpng-1.6.37.tar.gz",
                  "https://mirror.koddos.net/pub/software/graphics/libpng/libpng-1.6.37.tar.gz",
                  "https://ftp.lip6.fr/pub/pcgs/graphics/png/libpng-1.6.37.tar.gz",
              ],
              "sdl2_mixer": [
                  "https://www.libsdl.org/release/SDL2_mixer-2.6.3.tar.gz",
                  "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_mixer-2.6.3.tar.gz",
              ],
              "sdl2_image": [
                  "https://www.libsdl.org/release/SDL2_image-2.8.0.tar.gz",
                  "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_image-2.8.0.tar.gz",
              ],
              "sdl2_ttf": [
                  "https://www.libsdl.org/release/SDL2_ttf-2.20.2.tar.gz",
                  "https://ftp.lip6.fr/pub/pcgs/sdl2/SDL2_ttf-2.20.2.tar.gz",
              ],
          }

          ROUTE_RULES = {
              "download.savannah.gnu.org": "freetype",
              "download-mirror.savannah.gnu.org": "freetype",
              "sourceforge.net/projects/freetype": "freetype",
              "downloads.sourceforge.net/project/freetype": "freetype",
              "sourceforge.net/projects/libpng": "libpng",
              "downloads.sourceforge.net/project/libpng": "libpng",
              "github.com/libsdl-org/SDL_mixer": "sdl2_mixer",
              "github.com/libsdl-org/SDL_image": "sdl2_image",
              "github.com/libsdl-org/SDL_ttf": "sdl2_ttf",
          }

          def route_mirrors(url: str):
              urls = [url]
              for key, group in ROUTE_RULES.items():
                  if key in url:
                      urls.extend(MIRROR_GROUPS.get(group, []))
                      break
              # 去重，保持顺序
              seen = set()
              ordered = []
              for u in urls:
                  if u not in seen:
                      ordered.append(u)
                      seen.add(u)
              return ordered

          def _looks_like_html(path: str) -> bool:
              try:
                  with open(path, "rb") as f:
                      head = f.read(512).lstrip()
                  return head.startswith(b"<")
              except Exception:
                  return False

          _orig_download_file = p4a_r.Recipe.download_file

          def patched_download_file(self, url, target, cwd=None):
              parsed = urlparse(url)
              if parsed.scheme not in ("http", "https"):
                  return _orig_download_file(self, url, target, cwd=cwd)

              target_path = os.path.join(cwd, target) if cwd else target
              os.makedirs(os.path.dirname(os.path.abspath(target_path)), exist_ok=True)

              last_err = None
              for candidate in route_mirrors(url):
                  print(f"[patch-dl] trying: {candidate}")
                  for attempt in range(5):
                      try:
                          if os.path.exists(target_path):
                              os.remove(target_path)

                          with requests.get(
                              candidate,
                              headers={"User-Agent": UA},
                              timeout=(30, 180),
                              allow_redirects=True,
                              stream=True,
                          ) as r:
                              r.raise_for_status()
                              ctype = (r.headers.get("content-type") or "").lower()
                              with open(target_path, "wb") as f:
                                  for chunk in r.iter_content(chunk_size=1024 * 64):
                                      if chunk:
                                          f.write(chunk)

                          if not os.path.isfile(target_path):
                              raise RuntimeError(f"download target not created: {target_path}")

                          if os.path.getsize(target_path) < 4096 and _looks_like_html(target_path):
                              raise RuntimeError("mirror returned HTML instead of archive")

                          print(f"[patch-dl] OK -> {target_path}")
                          return target_path

                      except Exception as e:
                          last_err = e
                          print(f"[patch-dl] retry {attempt + 1}/5 failed: {e}")
                          if attempt < 4:
                              time.sleep(2 ** attempt)

                  print(f"[patch-dl] mirror exhausted: {candidate}")

              raise last_err if last_err else RuntimeError(f"failed to download: {url}")

          p4a_r.Recipe.download_file = patched_download_file

          def read_buildozer_spec():
              spec_path = os.path.join(WORKSPACE, "buildozer.spec")
              meta = {
                  "private": WORKSPACE,
                  "package": "org.example.netease_comment_viewer",
                  "name": "Netease Comment Viewer",
                  "version": "0.1",
                  "requirements": "python3,kivy==2.3.0,KivyMD==1.1.1,pillow,urllib3",
              }

              if not os.path.isfile(spec_path):
                  return meta

              parser = configparser.ConfigParser()
              parser.read(spec_path, encoding="utf-8")
              if "app" not in parser:
                  return meta

              app = parser["app"]

              source_dir = app.get("source.dir", ".").strip()
              meta["private"] = os.path.abspath(os.path.join(WORKSPACE, source_dir))

              package_name = app.get("package.name", "netease_comment_viewer").strip()
              package_domain = app.get("package.domain", "org.example").strip()
              package_name = package_name.replace("-", "_")
              meta["package"] = f"{package_domain}.{package_name}"

              title = app.get("title", package_name).strip()
              if title:
                  meta["name"] = title

              version = app.get("version", "").strip()
              if version:
                  meta["version"] = version

              requirements = app.get("requirements", "").strip()
              if requirements:
                  meta["requirements"] = requirements

              return meta

          meta = read_buildozer_spec()

          print("[meta]", meta)

          sys.argv = [
              "toolchain.py",
              "apk",
              f"--private={meta['private']}",
              f"--package={meta['package']}",
              f"--name={meta['name']}",
              f"--version={meta['version']}",
              f"--dist-name={P4A_DIST_NAME}",
              "--bootstrap=sdl2",
              f"--requirements={meta['requirements']}",
              "--arch=arm64-v8a",
              "--arch=armeabi-v7a",
              f"--android-api={ANDROID_API}",
              "--ndk-api=21",
              f"--storage-dir={P4A_STORAGE_DIR}",
              f"--sdk-dir={ANDROID_SDK}",
              f"--ndk-dir={ANDROID_NDK}",
              "--copy-libs",
              "--debug",
          ]

          from pythonforandroid.toolchain import main
          main()
          PYEOF

          export ANDROIDSDK=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROIDNDK=/usr/local/lib/android/sdk/ndk/${ANDROID_NDK_VERSION}
          export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/${ANDROID_NDK_VERSION}
          export P4A_ANDROID_NDK_API=21

          python /tmp/p4a_build.py 2>&1 | tee /tmp/p4a_build.log

      - name: Find and copy APK
        if: success()
        run: |
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f 2>/dev/null || true
          mkdir -p bin
          find "${P4A_STORAGE_DIR}" -name "*.apk" -type f -exec cp {} bin/ \; 2>/dev/null || true
          find .buildozer -name "*.apk" -type f -exec cp {} bin/ \; 2>/dev/null || true
          echo "=== APKs in bin/ ==="
          ls -lh bin/*.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netease-comment-viewer-apk
          path: bin/*.apk
          retention-days: 30

      - name: Show error log
        if: failure()
        run: |
          echo "=== p4a build log ==="
          tail -n 200 /tmp/p4a_build.log 2>/dev/null || true
          echo ""
          echo "=== .buildozer logs ==="
          find .buildozer -maxdepth 3 -type f | sort | tail -n 50 || true
