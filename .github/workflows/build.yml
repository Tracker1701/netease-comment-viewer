name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.x'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            tcl \
            tk

      - name: Install Python packages
        run: |
          pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.36
          pip install buildozer==1.5.0

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        id: cache-android
        with:
          path: |
            ~/.buildozer/android/platform
            ~/.buildozer/android/sdk
            ~/.buildozer/android/ndk
          key: android-build-tools-${{ runner.os }}

      - name: Debug environment
        run: |
          echo "=== Java version ==="
          java -version 2>&1
          echo ""
          echo "=== JAVA_HOME ==="
          echo $JAVA_HOME
          echo ""
          echo "=== ANDROID_HOME ==="
          echo $ANDROID_HOME
          echo ""
          echo "=== Buildozer version ==="
          buildozer --version
          echo ""
          echo "=== Cython version ==="
          cython --version
          echo ""
          echo "=== Python version ==="
          python3 --version
          echo ""
          echo "=== SDK contents ==="
          ls ~/.buildozer/android/sdk/ 2>/dev/null || echo "SDK dir empty or missing"
          echo ""
          echo "=== NDK contents ==="
          ls ~/.buildozer/android/ndk/ 2>/dev/null || echo "NDK dir empty or missing"

      - name: Build debug APK
        run: |
          buildozer android debug --verbose=2
        env:
          BUILDZERP_VERBOSE: 2

      - name: Show output
        if: success()
        run: |
          echo "=== APK files ==="
          ls -lh bin/*.apk 2>/dev/null || echo "No APK found in bin/"
          echo ""
          echo "=== bin/ contents ==="
          ls -la bin/ 2>/dev/null || echo "No bin/ directory"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netease-comment-viewer-apk
          path: bin/*.apk
          retention-days: 30

      - name: Show error log
        if: failure()
        run: |
          echo "=== Buildozer log ==="
          cat .buildozer/logs/buildozer.log 2>/dev/null || echo "No buildozer log found"
          echo ""
          echo "=== Last 100 lines of buildozer log ==="
          tail -n 100 .buildozer/logs/buildozer.log 2>/dev/null || true
