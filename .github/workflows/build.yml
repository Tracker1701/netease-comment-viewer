name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.x'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            pkg-config \
            tcl \
            tk \
            wget \
            make \
            gcc \
            g++ \
            ccache

      - name: Set up Android SDK + tools for buildozer
        run: |
          # 让 buildozer/p4a 能找到 SDK
          mkdir -p ~/.buildozer/android/platform
          ln -sfn /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
                 ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          echo "=== SDK tools/bin ==="
          ls -la ~/.buildozer/android/platform/android-sdk/tools/bin/

      - name: Accept Android SDK licenses
        run: |
          export SDK=~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $SDK/tools/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $SDK/tools/bin/sdkmanager \
            "build-tools;37.0.0" "platforms;android-34" \
            --sdk_root=$SDK 2>/dev/null || true
          echo "=== Licenses ==="
          ls ~/.android/

      - name: Install Python packages
        run: |
          pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.36
          pip install buildozer==1.5.0
          pip install python-for-android

      - name: Get p4a location
        id: p4a
        run: |
          P4A_DIR=$(python3 -c "import pythonforandroid; import os; print(os.path.dirname(pythonforandroid.__file__))")
          echo "p4a_dir=$P4A_DIR" >> $GITHUB_OUTPUT
          echo "=== p4a contents ==="
          ls $P4A_DIR/

      - name: Pre-download source packages (Python, handles redirects)
        run: |
          set -e
          PKGS=".buildozer/android/platform/build/packages"
          mkdir -p $PKGS/freetype $PKGS/sdl2_ttf

          python3 << 'PYEOF'
          import os, urllib.request, urllib.error

          PKGS = ".buildozer/android/platform/build/packages"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          def download(url, dest, min_size=50000):
              """下载文件，验证大小，成功返回True"""
              if os.path.exists(dest):
                  sz = os.path.getsize(dest)
                  if sz >= min_size:
                      print(f"  Already exists: {dest} ({sz} bytes)")
                      return True
              print(f"  Downloading {url}")
              print(f"  -> {dest}")
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      data = r.read()
                  with open(dest, 'wb') as f:
                      f.write(data)
                  sz = len(data)
                  print(f"  Downloaded: {sz} bytes")
                  return sz >= min_size
              except Exception as e:
                  print(f"  FAILED: {e}")
                  return False

          # freetype: try SourceForge first, then savannah mirror
          ft_dir = os.path.join(PKGS, "freetype")
          os.makedirs(ft_dir, exist_ok=True)
          ft_file = os.path.join(ft_dir, "freetype-2.10.1.tar.gz")
          ok = download(
              "https://downloads.sourceforge.net/project/freetype/freetype2/2.10.1/freetype-2.10.1.tar.gz",
              ft_file
          )
          if not ok:
              # Fallback: savannah GNU
              ok = download(
                  "https://download.savannah.gnu.org/releases/freetype/freetype-2.10.1.tar.gz",
                  ft_file
              )
          if not ok:
              # Fallback: GitHub mirror
              ok = download(
                  "https://github.com/behdad/freetype/releases/download/v2.10.1/freetype-2.10.1.tar.gz",
                  ft_file
              )
          if not ok:
              raise RuntimeError(f"Could not download freetype!")

          # sdl2_ttf
          sdl_dir = os.path.join(PKGS, "sdl2_ttf")
          os.makedirs(sdl_dir, exist_ok=True)
          download(
              "https://www.libsdl.org/projects/SDL_ttf/release/SDL2_ttf-2.0.15.tar.gz",
              os.path.join(sdl_dir, "sdl2_ttf-2.0.15.tar.gz")
          )

          print("\n=== Downloaded packages ===")
          for root, dirs, files in os.walk(PKGS):
              for f in files:
                  if f.endswith(".tar.gz"):
                      p = os.path.join(root, f)
                      print(f"  {p}  ({os.path.getsize(p)} bytes)")
          PYEOF

      - name: Build APK using p4a directly (avoids autoreconf issue)
        run: |
          python3 -m pythonforandroid.toolchain create \
            --dist-name=netease_comment_viewer \
            --bootstrap=sdl2 \
            --requirements=python3,kivy==2.3.0,KivyMD==1.1.1,pillow,urllib3 \
            --arch=arm64-v8a \
            --arch=armeabi-v7a \
            --android-api=34 \
            --ndk-api=21 \
            --copy-libs \
            --color=always \
            --storage-dir=.buildozer/android/platform/build \
            --debug \
            2>&1
        env:
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          # 让 p4a 使用 pip 安装的 recipes
          P4A_ANDROID_NDK_API: '21'

      - name: Find and copy APK
        if: success()
        run: |
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo ""
          # Copy to bin/
          mkdir -p bin
          cp .buildozer/android/platform/build/*/armeabi-v7a/*/dist/*.apk bin/ 2>/dev/null || \
          cp .buildozer/android/platform/build/*/armeabi-v7a/*/*.apk bin/ 2>/dev/null || \
          find .buildozer -name "*.apk" -exec cp {} bin/ \; 2>/dev/null || true
          echo "=== APKs in bin/ ==="
          ls -lh bin/*.apk 2>/dev/null || echo "No APK found in bin/"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netease-comment-viewer-apk
          path: bin/*.apk
          retention-days: 30

      - name: Show error log
        if: failure()
        run: |
          echo "=== build directory ==="
          find .buildozer -name "*.apk" 2>/dev/null | head -5
          echo ""
          echo "=== Last 100 lines of p4a output (if any) ==="
          tail -n 100 .buildozer/logs/buildozer.log 2>/dev/null || echo "No buildozer log"
